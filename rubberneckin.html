}

async function rkOpenUnderground(){
  rkUndergroundEnsureScreen();
  const body = document.getElementById('rk-ug-body');
  body.innerHTML = '';
  rkGoto('screen-underground');
  const data = _RK_PASSPORT_PREVIEW ? _rkPassportPreviewData() : await rkPassportLoad();
  rkRenderUnderground(data);
}

function rkRenderUnderground(p){
  const body = document.getElementById('rk-ug-body');
  if(!body) return;
  if(!p){
    body.innerHTML = `<div class="rk-ug-card rk-ug-error">
      🚧 The Underground is closed for a moment. Your journey is safe — try again in a little while.</div>`;
    return;
  }
  const n = p.n || 15;
  const circuit = RK_STATIONS.filter(st => st.id in (p.bars || {}));
  const bars = circuit.map(st => {
    const v = Math.max(0, Math.min(p.bars[st.id] || 0, n));
    const full = v >= n;
    // Excedente: lo acumulado en la estación más allá de esta vuelta (los contadores nunca se
    // reinician; ver §5 y §11.1 de la mecánica).
    const extra = (p.stations && st.id in p.stations)
      ? Math.max(0, p.stations[st.id] - (p.stampCount || 0) * n - n) : 0;
    let groups = '';
    for(let g = 0; g < n; g += 5){
      let c = '';
      for(let i = g; i < Math.min(g + 5, n); i++){
        c += i < v ? `<span class="rk-ug-coin5 on" style="animation-delay:${i * 35}ms">$</span>` : `<span class="rk-ug-coin5 off"></span>`;
      }
      groups += `<span class="rk-ug-coingroup">${c}</span>`;
    }
    return `<div class="rk-ug-coinrow${full ? ' full' : ''}" title="${v} of ${n} shillings">
      <span class="rk-ug-bar-name">${st.icon} ${rkEscapeHtml(st.name)}</span>
      <span class="rk-ug-coins">${groups}</span>
      <span class="rk-ug-bar-num">${full ? '✓ ' : ''}${v} / ${n}${extra > 0
        ? `<span class="rk-ug-extra" title="${extra} extra shillings saved for your next stamps">+${extra} saved</span>` : ''}</span>
    </div>`;
  }).join('');
  const faltan = circuit.filter(st => (p.bars[st.id] || 0) < n).length;
  _rkUgData = p;
  _rkUgPage = Math.max(0, Math.ceil((p.stamps || []).length / RK_UG_PER_PAGE) - 1);   // abre en el sello más reciente

  // B (Angel + Chatty, 16 oct): el pasaporte es el protagonista y va arriba; el bolsillo pasa a
  // ser una etiqueta junto a las barras, para que no compita con el álbum.
  body.innerHTML = `
    <div class="rk-ug-passport">
      <div class="rk-ug-passport-h">
        <div class="rk-ug-passport-title">PASSPORT</div>
        <div class="rk-ug-passport-right">
          <div class="rk-ug-passport-sub">Discovered together · it's saved, come back any time</div>
          <button class="rk-ug-maps-btn" onclick="rkOpenMaps()">🗺️ Maps</button>
        </div>
      </div>
      <div id="rk-ug-pages"></div>
      <div class="rk-ug-prizes" id="rk-ug-prizes"></div>
    </div>
    <div class="rk-ug-card">
      <div class="rk-ug-head">
        <div class="rk-ug-kicker">Your next Passport Stamp</div>
        <div class="rk-ug-pill">🪙 ${p.shillings || 0} shillings in your pocket</div>
      </div>
      <div class="rk-ug-bars">${bars}</div>
      <div class="rk-ug-rule">Collect ${n} shillings in every station to earn a Passport Stamp.</div>
      <div class="rk-ug-next">
        <div class="rk-ug-next-q">?</div>
        <div>
          <div class="rk-ug-next-t">Next stop: where will you go?</div>
          <div class="rk-ug-next-s">${faltan === 0 ? 'All six stations are full!'
            : faltan === 1 ? 'Just one station to go — then a new place in the UK.'
            : `${faltan} stations to go — then a new place in the UK.`}</div>
        </div>
      </div>
    </div>
    ${_RK_PASSPORT_PREVIEW ? `<button class="rk-sk-primary-btn rk-ug-preview-btn" onclick="rkPreviewStampMoment()">▶ Preview the stamp moment</button>
      <button class="rk-sk-primary-btn rk-ug-preview-btn" onclick="rkPreviewPrize()">🏆 Preview the prizes</button>` : ''}`;
  rkRenderPassportPage();
  rkRenderPrizes();
}

// ── Las páginas del pasaporte ───────────────────────────────────────────────
const RK_UG_PER_PAGE = 5;
let _rkUgPage = 0, _rkUgData = null;

function rkRenderPassportPage(){
  const box = document.getElementById('rk-ug-pages');
  if(!box || !_rkUgData) return;
  const stamps = _rkUgData.stamps || [];
  const pages = Math.max(1, Math.ceil(stamps.length / RK_UG_PER_PAGE));
  _rkUgPage = Math.max(0, Math.min(_rkUgPage, pages - 1));
  const first = _rkUgPage * RK_UG_PER_PAGE;
  const rots = [-6, 4, -2, 6, -4];
  let slots = '';
  for(let k = 0; k < RK_UG_PER_PAGE; k++){
    const s = stamps[first + k];
    slots += s
      ? `<div class="rk-ug-slot">${rkStampHtml(s, rots[k])}
           <div class="rk-ug-cap">${rkEscapeHtml(s.place).replace(/\//g, '/<wbr>')}<br><span style="font-weight:500">${rkEscapeHtml(s.nation)}</span></div>
           <div class="rk-ug-date">${rkStampDate(s.date)}</div></div>`
      : `<div class="rk-ug-slot empty"><div class="rk-ug-holebox"><div class="rk-ug-hole">?</div></div>
           <div class="rk-ug-cap" style="font-weight:500;color:#9a8a60">A place<br>to visit</div><div class="rk-ug-date">&nbsp;</div></div>`;
  }
  const left = stamps.length
    ? `${stamps.length} stamp${stamps.length === 1 ? '' : 's'}${_rkUgData.destinationsLeft > 0 ? ` · ${_rkUgData.destinationsLeft} places still to discover` : ''}`
    : 'Your passport is waiting for its first stamp. 🛂';
  box.innerHTML = `
    <div class="rk-ug-book">
      <button class="rk-ug-arrow" aria-label="Previous page" onclick="rkPassportFlip(-1)"${_rkUgPage === 0 ? ' disabled' : ''}>‹</button>
      <div class="rk-ug-grid">${slots}</div>
      <button class="rk-ug-arrow" aria-label="Next page" onclick="rkPassportFlip(1)"${_rkUgPage >= pages - 1 ? ' disabled' : ''}>›</button>
    </div>
    <div class="rk-ug-foot"><span>${left}</span>${pages > 1 ? `<span>Page ${_rkUgPage + 1} of ${pages}</span>` : ''}</div>`;
}

function rkPassportFlip(delta){
  _rkUgPage += delta;
  rkRenderPassportPage();
}

// ── El momento del sello ────────────────────────────────────────────────────
let _rkStampQueue = [];
let _rkAudioCtx = null;

function rkStampEnsureOverlay(){
  if(document.getElementById('rk-stamp-overlay')) return;
  const el = document.createElement('div');
  el.id = 'rk-stamp-overlay';
  el.innerHTML = `
    <div class="rk-stamp-card" id="rk-stamp-card">
      <div class="rk-stamp-kicker">PASSPORT STAMP!</div>
      <div class="rk-stamp-box" id="rk-stamp-box"></div>
      <div class="rk-stamp-place" id="rk-stamp-place"></div>
      <div class="rk-stamp-nation" id="rk-stamp-nation"></div>
      <div class="rk-stamp-shows" id="rk-stamp-shows"></div>
      <div class="rk-stamp-fact" id="rk-stamp-fact"></div>
      <button class="rk-stamp-where" id="rk-stamp-where" onclick="rkStampWhere()">Where is it? 🗺️</button>
      <div class="rk-stamp-together">Discovered together · it's in your passport now</div>
      <button class="rk-sk-primary-btn" id="rk-stamp-continue" onclick="rkStampNext()">Keep exploring →</button>
    </div>`;
  document.body.appendChild(el);
}

// Timbre: golpe grave + "clac" corto, generado en el navegador (sin archivo de audio).
// El juego ya tuvo clics antes de esto, así que el navegador deja sonar el AudioContext.
function rkStampThunk(){
  try{
    _rkAudioCtx = _rkAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(_rkAudioCtx.state === 'suspended') _rkAudioCtx.resume();
    const ctx = _rkAudioCtx, t = ctx.currentTime + 0.30;   // calza con el golpe de la animación
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.14);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.25);
    const len = Math.floor(ctx.sampleRate * 0.06), buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const nz = ctx.createBufferSource(), f = ctx.createBiquadFilter(), ng = ctx.createGain();
    nz.buffer = buf; f.type = 'lowpass'; f.frequency.value = 1400; ng.gain.value = 0.6;
    nz.connect(f).connect(ng).connect(ctx.destination); nz.start(t);
  }catch(e){ /* sin sonido no pasa nada */ }
}

function rkShowStampMoment(stamp){
  rkStampEnsureOverlay();
  const box = document.getElementById('rk-stamp-box');
  box.innerHTML = rkStampHtml(stamp, -6);
  document.getElementById('rk-stamp-place').textContent = stamp.place;
  document.getElementById('rk-stamp-nation').textContent =
    stamp.nation + (stamp.date ? ' · ' + rkStampDate(stamp.date) : '');
  document.getElementById('rk-stamp-shows').textContent =
    RK_STAMP_SHOWS[stamp.place] ? 'On the stamp: ' + RK_STAMP_SHOWS[stamp.place] : '';
  document.getElementById('rk-stamp-fact').textContent = RK_STAMP_FACTS[stamp.place] || '';
  _rkStampShown = stamp;
  document.getElementById('rk-stamp-where').style.display = rkMapFor(stamp.place) ? '' : 'none';
  document.getElementById('rk-stamp-continue').textContent =
    _rkStampQueue.length ? (_rkStampQueue[0].prize ? 'Next — a prize! 🏆' : 'Next stamp →') : 'Keep exploring →';
  document.getElementById('rk-stamp-overlay').classList.add('on');
  const st = box.querySelector('.rk-stamp');
  void st.offsetWidth; st.classList.add('drop');
  const card = document.getElementById('rk-stamp-card');
  card.classList.remove('shake');
  setTimeout(() => { void card.offsetWidth; card.classList.add('shake'); }, 300);
  rkStampThunk();
}

function rkStampNext(){
  const next = _rkStampQueue.shift();
  if(next && next.prize){ document.getElementById('rk-stamp-overlay').classList.remove('on'); rkShowPrize(next.prize); return; }
  if(next){ rkClosePrize(); rkShowStampMoment(next); return; }
  document.getElementById('rk-stamp-overlay').classList.remove('on');
  rkClosePrize();
  // Si estaban mirando el Underground (caso de la vista previa), se refresca el pasaporte
  const ug = document.getElementById('screen-underground');
  if(ug && ug.classList.contains('active') && !_RK_PASSPORT_PREVIEW) rkRenderUnderground(RK_PASSPORT);
}

// Lo llama rkEarnShillings() cuando el servidor otorga uno o más sellos. Un pago grande
// puede cruzar dos umbrales: se muestran de a uno, en orden.
// Misión 13: si un sello cruza un hito (10, 15, 20, 22), el premio aparece justo después de ese sello.
// total = cuántos sellos hay en el pasaporte después de ganar estos (lo dice el servidor).
function rkStampMomentShow(stamps, total){
  if(!stamps || !stamps.length) return;
  if(total == null) total = (RK_PASSPORT && RK_PASSPORT.stamps) ? RK_PASSPORT.stamps.length : stamps.length;
  const cola = [];
  stamps.forEach((s, i) => {
    cola.push(s);
    const p = RK_PRIZES.find(p => p.at === total - stamps.length + i + 1);
    if(p) cola.push({ prize: p });
  });
  _rkStampQueue = cola.slice(1);
  rkShowStampMoment(cola[0]);
}

function rkPreviewStampMoment(){
  const pool = [ { place:'Edinburgh', nation:'Scotland' }, { place:'London', nation:'England' },
                 { place:'Cardiff', nation:'Wales' }, { place:"Giant's Causeway", nation:'Northern Ireland' } ];
  rkPreviewStampMoment._i = ((rkPreviewStampMoment._i || 0) + 1) % pool.length;
  rkStampMomentShow([{ ...pool[rkPreviewStampMoment._i], date: _rkTodayIso() }]);
}

// ── Los mapas ───────────────────────────────────────────────────────────────
let _rkStampShown = null, _rkMapIdx = 0, _rkMapHighlight = null, _rkMapStamps = [];

function rkMapFor(place){ return RK_MAPS.findIndex(m => place in m.places) >= 0 ? RK_MAPS.find(m => place in m.places) : null; }

function rkMapEnsureOverlay(){
  if(document.getElementById('rk-map-overlay')) return;
  const el = document.createElement('div');
  el.id = 'rk-map-overlay';
  el.onclick = e => { if(e.target === el) rkCloseMaps(); };
  el.innerHTML = `<div class="rk-map-card"><div class="rk-map-tabs" id="rk-map-tabs"></div>
    <div class="rk-map-frame2" id="rk-map-frame2"></div>
    <div class="rk-map-foot"><span class="rk-map-count" id="rk-map-count"></span>
      <button class="rk-sk-primary-btn rk-map-close" onclick="rkCloseMaps()">✕ Close</button></div></div>`;
  document.body.appendChild(el);
}

// stamps: los sellos del pasaporte; highlight: el lugar recién ganado (se marca con un pulso).
function rkOpenMaps(nation, highlight, stamps){
  rkMapEnsureOverlay();
  _rkMapStamps = stamps || (_RK_PASSPORT_PREVIEW && _rkUgData ? _rkUgData.stamps
                            : (RK_PASSPORT && RK_PASSPORT.stamps) || []);
  _rkMapHighlight = highlight || null;
  const i = RK_MAPS.findIndex(m => m.nation === nation);
  _rkMapIdx = i >= 0 ? i : 0;
  rkRenderMap();
  document.getElementById('rk-map-overlay').classList.add('on');
}

function rkRenderMap(){
  const m = RK_MAPS[_rkMapIdx];
  document.getElementById('rk-map-tabs').innerHTML = RK_MAPS.map((x, i) =>
    `<button class="rk-map-tab${i === _rkMapIdx ? ' on' : ''}" style="--rk-ink:${RK_NATION_INK[x.nation]}"
      onclick="_rkMapIdx=${i};rkRenderMap()">${rkEscapeHtml(x.nation)}</button>`).join('');
  const visited = new Set(_rkMapStamps.map(s => s.place));
  if(_rkMapHighlight) visited.add(_rkMapHighlight);
  const pins = Object.entries(m.places).filter(([pl]) => visited.has(pl)).map(([pl, [x, y]]) =>
    `<span class="rk-map-pin${pl === _rkMapHighlight ? ' new' : ''}" style="left:${x}%;top:${y}%"
      title="${rkEscapeHtml(pl)}">✓</span>`).join('');
  document.getElementById('rk-map-frame2').innerHTML =
    `<img src="${RK_MAP_DIR}${m.file}" alt="Map of ${rkEscapeHtml(m.nation)}">${pins}`;
  const total = Object.keys(m.places).length;
  const n = Object.keys(m.places).filter(pl => visited.has(pl)).length;
  document.getElementById('rk-map-count').textContent = n === 0
    ? `No stamps from ${m.nation} yet — keep exploring!`
    : `You have visited ${n} of ${total} places in ${m.nation}.`;
}

function rkCloseMaps(){
  const el = document.getElementById('rk-map-overlay');
  if(el) el.classList.remove('on');
}

// Desde el momento del sello: el mapa de esa nación, con el lugar nuevo destacado. Al cerrar el
// mapa, el niño vuelve a la tarjeta del sello y sigue con "Keep exploring".
function rkStampWhere(){
  const s = _rkStampShown;
  if(!s) return;
  const m = rkMapFor(s.place);
  if(m) rkOpenMaps(m.nation, s.place);
}

// ── La barra de la estación junto a la línea de pago ────────────────────────
// "💰 3 shillings earned · 🚇 Match Day 12/15": el recordatorio de los anillos, sin tocar el mapa.
function rkBarNote(station, data){
  const bars = data && data.passport && data.passport.bars;
  if(!bars || !(station in bars)) return '';
  const st = RK_STATIONS.find(s => s.id === station);
  const n = data.passport.n || 15;
  return ` · 🚇 ${st ? st.name : station} ${bars[station]}/${n}${bars[station] >= n ? ' ✓' : ''}`;
}

// ── El botón UNDERGROUND del mapa ───────────────────────────────────────────
// Solo aparece cuando el tema lleva puntaje (el verano, 'full') o en la vista previa: en un
// demo sin puntaje mostraría un pasaporte vacío que no avanza, y eso confunde más que ayuda.
function rkUndergroundHotspot(){
  if(!_RK_PASSPORT_PREVIEW && !RK_THEMES_CON_PUNTAJE.includes(RK_ACTIVE_THEME)) return;
  const wrap = document.getElementById('rk-hotspots');

  b.setAttribute('aria-label', 'The Underground — your journey');
  // Centro del roundel medido sobre menu.png (x 3,8–13,3 %, y 78,8–96,5 %)
  Object.assign(b.style, { left:'8.6%', top:'87.6%', width:'12.4%', height:'19.5%' });
  b.onclick = rkOpenUnderground;
  wrap.appendChild(b);
}


// ══ Misión 13 (17 oct) ═════════════════════════════════════════════════════════════════════════════
// ── La ficha 🔑: una canción de Abbey Road o una película de Electric Cinema, encima de la ronda ──────
// La pieza trae key:'song:<id>' o key:'movie:<id>'. La ficha se abre en una capa, así la ronda no se
// pierde; desde ahí pueden escuchar la canción o ver el tráiler en otra pestaña. Nunca letras.
function rkKeyParse(key){
  if(!key || typeof key !== 'string') return null;
  const [kind, id] = key.split(':');
  const data = kind === 'song' ? RK_ABBEY_SONGS[id] : kind === 'movie' ? RK_MOVIES[id] : null;
  return data ? { kind, id, data } : null;
}
function rkKeyButton(key){
  const k = rkKeyParse(key);
  if(!k) return '';
  const donde = k.kind === 'song' ? 'Abbey Road' : 'Electric Cinema';
  return `<button class="rk-key-btn" onclick="rkOpenKeyCard('${key}')">🔑 The answer is in ${donde} — open the card</button>`;
}
function rkKeyEnsureOverlay(){
  if(document.getElementById('rk-key-overlay')) return;
  const el = document.createElement('div');
  el.id = 'rk-key-overlay';
  el.onclick = e => { if(e.target === el) rkCloseKeyCard(); };
  el.innerHTML = `<div class="rk-key-card"><div class="rk-key-kicker">🔑 FIND THE ANSWER IN THIS CARD</div>
    <div id="rk-key-body" style="display:flex;flex-direction:column;gap:10px"></div></div>`;
  document.body.appendChild(el);
}
function rkOpenKeyCard(key){
  const k = rkKeyParse(key);
  if(!k) return;
  rkKeyEnsureOverlay();
  const d = k.data, vocab = d.vocab || [], facts = d.facts || [];
  const titulo = k.kind === 'song' ? d.title : `🎬 ${d.title} (${d.year})`;
  const enlace = k.kind === 'song'
    ? `<a class="rk-sk-primary-btn" href="${rkAbbeyYtUrl(d)}" target="_blank" rel="noopener">🎵 Listen on YouTube Music</a>`
    : `<a class="rk-sk-primary-btn" href="${rkYtTrailerUrl(d.title)}" target="_blank" rel="noopener">▶ Watch the trailer</a>`;
  document.getElementById('rk-key-body').innerHTML = `
    <div class="rk-sk-card"><div class="rk-info-title">${rkEscapeHtml(titulo)}</div><div class="rk-info-blurb">${rkEscapeHtml(d.blurb)}</div></div>
    ${vocab.length ? `<div class="rk-vocab-grid">${vocab.map(v => `<div class="rk-vocab-item"><div class="rk-vocab-word">${rkEscapeHtml(v.w)}</div><div class="rk-vocab-mean">${rkEscapeHtml(v.m)}</div></div>`).join('')}</div>` : ''}
    ${facts.length ? `<div class="rk-sk-card"><div class="rk-info-title" style="font-size:14px">${k.kind === 'song' ? '🎶' : '🍿'} Did you know?</div><ul class="rk-fact-list">${facts.map(f => `<li>${rkEscapeHtml(f)}</li>`).join('')}</ul></div>` : ''}
    <div class="rk-sk-actions">${enlace}
      <button class="rk-sk-secondary-btn" onclick="rkCloseKeyCard()">← Back to the question</button></div>`;
  document.getElementById('rk-key-overlay').classList.add('on');
  document.querySelector('#rk-key-overlay .rk-key-card').scrollTop = 0;
}
function rkCloseKeyCard(){
  const el = document.getElementById('rk-key-overlay');
  if(el) el.classList.remove('on');
}

// ── Premios por hito (Angel, 17 oct) ─────────────────────────────────────────────────────────────────

const RK_PRIZE_DIR = 'rubberneckin-assets/prizes/';
const RK_PRIZES = [
  // 17 oct (Angel): 10 sellos era mucha espera para el primer premio. A los 5 se desbloquea el mapa "en blanco"
  // (papel con el contorno), que después se vuelve plata, oro y diamante.
  { at: 5, img: 'uk-blank.png', short: 'Blank map', kicker: '5 PASSPORT STAMPS!', title: 'The UK Map',
    text: 'Welcome! You unlocked the map of the United Kingdom. Keep exploring to turn it silver, gold and diamond!',
    bg: 'linear-gradient(135deg,#fbf8ef,#e9e1c9)', ink: '#1d2a62' },
  { at: 10, img: 'uk-silver.png', short: 'Silver map', kicker: '10 PASSPORT STAMPS!', title: 'The Silver Map',
    text: 'Ten places discovered together! Your map of the United Kingdom is turning silver.',
    bg: 'linear-gradient(135deg,#f4f6f9,#cfd6df)', ink: '#56606e' },
  { at: 15, img: 'uk-gold.png', short: 'Gold map', kicker: '15 PASSPORT STAMPS!', title: 'The Gold Map',
    text: 'Fifteen places! Your map of the United Kingdom is now gold. What a journey!',
    bg: 'linear-gradient(135deg,#fff6d6,#efd27f)', ink: '#8a6200' },
  { at: 20, img: 'uk-diamond.png', short: 'Diamond map', kicker: '20 PASSPORT STAMPS!', title: 'The Diamond Map',
    text: 'Twenty places! Your map is shining like a diamond. Only two more places to complete your passport.',
    bg: 'linear-gradient(135deg,#f0fbff,#c6e9f7)', ink: '#1f6f8b' },
  { at: 22, img: 'passport.png', short: 'Passport complete', kicker: 'PASSPORT COMPLETE!', title: 'You did it!',
    text: 'All 22 places in the United Kingdom, discovered together. Your passport is full. Congratulations, explorers!',
    bg: 'linear-gradient(135deg,#f6efdc,#e9d9a8)', ink: '#7a2a2a', final: true },
];
function rkPrizeEnsureOverlay(){
  if(document.getElementById('rk-prize-overlay')) return;
  const el = document.createElement('div');
  el.id = 'rk-prize-overlay';
  el.innerHTML = `<div class="rk-prize-card" id="rk-prize-card">
    <div class="rk-prize-kicker" id="rk-prize-kicker"></div>
    <div class="rk-prize-img" id="rk-prize-img"></div>
    <div class="rk-prize-title" id="rk-prize-title"></div>
    <div class="rk-prize-text" id="rk-prize-text"></div>
    <button class="rk-sk-primary-btn" id="rk-prize-continue" onclick="rkStampNext()">Keep exploring →</button></div>`;
  document.body.appendChild(el);
}
function rkPrizeNextLine(p){
  const sig = RK_PRIZES.find(x => x.at > p.at);
  return sig ? ` Next prize: ${sig.title.replace(/^The /, 'the ')}, at ${sig.at} stamps.` : '';
}
function rkShowPrize(p, quiet){
  rkPrizeEnsureOverlay();
  const card = document.getElementById('rk-prize-card');
  card.style.setProperty('--rk-prize-bg', p.bg);
  card.style.setProperty('--rk-prize-ink', p.ink);
  document.getElementById('rk-prize-kicker').textContent = p.kicker;
  document.getElementById('rk-prize-img').innerHTML = `<img src="${RK_PRIZE_DIR}${p.img}" alt="${rkEscapeHtml(p.title)}">`;
  document.getElementById('rk-prize-title').textContent = p.title;
  document.getElementById('rk-prize-text').textContent = p.text + (p.at < 20 ? rkPrizeNextLine(p) : '');
  document.getElementById('rk-prize-continue').textContent =
    _rkStampQueue.length ? 'Next stamp →' : (p.final ? 'Look at our passport →' : 'Keep exploring →');
  document.getElementById('rk-prize-overlay').classList.add('on');
  if(!quiet) rkPrizeChime(p.final);
}
function rkClosePrize(){
  const el = document.getElementById('rk-prize-overlay');
  if(el) el.classList.remove('on');
}
// Campanitas: un arpegio corto (más largo para el pasaporte completo), sin archivo de audio
function rkPrizeChime(final){
  try{
    _rkAudioCtx = _rkAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(_rkAudioCtx.state === 'suspended') _rkAudioCtx.resume();
    const ctx = _rkAudioCtx, t0 = ctx.currentTime + 0.15;
    const notas = final ? [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5] : [523.25, 659.25, 783.99, 1046.5];
    notas.forEach((f, i) => {
      const t = t0 + i * (final ? 0.16 : 0.12), o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (i === notas.length - 1 ? 0.9 : 0.35));
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 1);
    });
  }catch(e){ /* sin sonido no pasa nada */ }
}
// La fila de premios bajo el pasaporte: los ganados se pueden volver a abrir
function rkRenderPrizes(){
  const box = document.getElementById('rk-ug-prizes');
  if(!box || !_rkUgData) return;
  const n = (_rkUgData.stamps || []).length;
  const sig = RK_PRIZES.find(p => p.at > n);
  box.innerHTML = RK_PRIZES.map((p, i) => n >= p.at
    ? `<button class="rk-ug-prize on" onclick="rkShowPrize(RK_PRIZES[${i}], true)" title="${rkEscapeHtml(p.title)}"><img src="${RK_PRIZE_DIR}${p.img}" alt=""><span>${rkEscapeHtml(p.short)}</span></button>`
    : `<div class="rk-ug-prize" title="${p.at} stamps"><img src="${RK_PRIZE_DIR}${p.img}" alt=""><span>${p.at} stamps</span></div>`).join('')
    + `<div class="rk-ug-prize-next">${sig ? `🏆 Next prize: ${rkEscapeHtml(sig.short.toLowerCase())} at ${sig.at} stamps — ${sig.at - n} to go.` : '🏆 Passport complete!'}</div>`;
}
function rkPreviewPrize(){
  rkPreviewPrize._i = ((rkPreviewPrize._i == null ? -1 : rkPreviewPrize._i) + 1) % RK_PRIZES.length;
  _rkStampQueue = [];
  rkShowPrize(RK_PRIZES[rkPreviewPrize._i]);
}
