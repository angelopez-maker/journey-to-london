<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Rubberneckin' — Journey to London</title>
<style>
  /*
    RUBBERNECKIN' — Summer Mode (módulo de prueba, invisible)
    ───────────────────────────────────────────────────────────
    Archivo completamente aparte de index.html. No hay ningún link ni botón
    hacia este archivo desde ninguna otra pantalla de la app — solo se llega
    por URL directa. Cero cambios en index.html ni en server.js.

    Alcance de esta primera versión (confirmado con Angel): navegación + arte
    completos, más la PRIMERA estación con mecánica real — Survival Kit
    (8 agosto, noche). Las otras 7 estaciones siguen en "Coming soon", a la
    espera de su propia pasada.

    Paleta, tipografías y patrón de pantallas (.screen/.screen.active)
    tomados directo de index.html para que se sienta parte de la misma app.

    Survival Kit reutiliza el mismo PATRÓN y los mismos ENDPOINTS que ya usan
    Fernando y Rodrigo en PET Training (Principio 12 — no reinventar), pero
    re-implementados acá con prefijo rk*/rkSk* porque este archivo no importa
    el <script> de index.html (son documentos HTML independientes, sin nada
    compartido en tiempo de ejecución):
      - Mic/Whisper:      rkMicStart()/rkMicStopAndTranscribe()/rkMicReset()
                           — mismo patrón que micStart() (índex ~línea 932),
                           mismo endpoint POST /api/transcribe.
      - TTS voz Oliver:   rkTtsSpeak() — mismo patrón que ttsSpeak() (índex
                           ~línea 1524), mismo endpoint POST /api/tts, con
                           fallback a speechSynthesis si falla.
      - Feedback Oliver:  rkCallClaude() — mismo patrón que callClaude()
                           (índex ~línea 1160), mismo endpoint POST /api/chat,
                           mismo modelo, y reutiliza la identidad de Oliver
                           Blackwood (avatar Avatar/oliver-blackwood.png) para
                           que se sienta el mismo personaje que ya conocen.
      Nada de esto tocó index.html ni server.js — los endpoints se llaman
      exactamente igual, solo cambia el archivo que los invoca.
  */
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;600&display=swap');
  :root {
    --bg:#0a0a1a;--bg2:#0f0f2a;--card:#12122a;--card2:#1a1a3a;--border:#2a2a5a;
    --blue:#3b82f6;--blue2:#60a5fa;--gold:#f59e0b;--gold2:#fcd34d;
    --green:#10b981;--purple:#8b5cf6;--red:#ef4444;--cyan:#06b6d4;
    --text:#e2e8f0;--muted:#94a3b8;
    --glow-gold:0 0 20px rgba(245,158,11,0.4);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}

  /* Todas las pantallas quedan superpuestas (position:fixed) y se diferencian solo por
     opacidad — así el cambio entre una y otra es un crossfade real (una se apaga
     mientras la otra se enciende), no un corte instantáneo. */
  .screen{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
    opacity:0;pointer-events:none;transition:opacity .5s ease;}
  .screen.active{opacity:1;pointer-events:auto;z-index:2;}

  /* Fijos por encima de TODAS las .screen (que llegan hasta z-index:2 cuando están activas),
     para que nunca desaparezcan al cambiar de pantalla — ver comentario junto al HTML. */
  .rk-menu-controls{position:fixed;top:16px;right:16px;z-index:20;display:flex;gap:8px;
    transition:opacity .3s ease;}
  .rk-menu-controls.rk-hidden{opacity:0;pointer-events:none;}
  .rk-icon-btn{width:38px;height:38px;border-radius:50%;background:rgba(18,18,42,.55);
    border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
  .rk-icon-btn:hover{border-color:var(--gold);color:var(--gold2);}

  /* ── Cover screens (Portada 1 / 2 / 3) ── */
  .rk-cover{align-items:center;justify-content:center;cursor:pointer;
    background:#000 center/cover no-repeat;}
  .rk-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .rk-cover-hint{position:absolute;bottom:26px;left:0;right:0;text-align:center;z-index:2;
    font-family:'Rajdhani',sans-serif;font-size:13px;letter-spacing:3px;text-transform:uppercase;
    color:rgba(255,255,255,.85);text-shadow:0 2px 8px rgba(0,0,0,.8);animation:rkPulse 1.8s ease-in-out infinite;}
  @keyframes rkPulse{0%,100%{opacity:.55}50%{opacity:1}}

  /* ── Menu screen (Tube map) ── */
  /* (9 agosto, ronda 3) Angel: el mapa quedaba "flotando" como un rectángulo blanco suelto
     sobre el fondo oscuro de la app — le faltaba cuerpo. Se agrega un "marco de folleto":
     .rk-map-wrap ahora es el marco (fondo azul Underground + padding + borde dorado fino vía
     box-shadow inset + sombra hacia afuera) y .rk-map-frame es la caja interna con aspect-ratio
     que contiene la imagen y los hotspots — se movió aspect-ratio/max-width ahí para que el
     marco no cambie cómo se calculan los porcentajes de los hotspots (siguen midiendo contra
     el mismo box de siempre, solo que ahora vive un nivel más adentro). */
  #screen-menu{align-items:center;justify-content:center;padding:24px;}
  .rk-map-wrap{width:100%;max-width:1456px;margin:0 auto;padding:14px;border-radius:20px;
    background:linear-gradient(160deg,#0a3161,#122a52);
    box-shadow:inset 0 0 0 2px rgba(252,211,77,.55),0 14px 40px rgba(0,0,0,.45);}
  .rk-map-frame{position:relative;width:100%;aspect-ratio:1408/768;}
  .rk-map-frame img{width:100%;height:100%;display:block;border-radius:10px;}
  .rk-hotspot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
    background:transparent;border:1px dashed rgba(255,255,255,.28);cursor:pointer;padding:0;
    transition:background .2s,box-shadow .2s;}
  .rk-hotspot:hover,.rk-hotspot:focus-visible{background:rgba(252,211,77,.16);
    box-shadow:0 0 0 4px rgba(252,211,77,.18);outline:none;}

  /* ── Postcard splash (primera vez que se entra a una estación) ── */
  #screen-postcard{align-items:center;justify-content:center;cursor:pointer;background:#000;}
  #screen-postcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

  /* ── Station screen ── */
  /* Fondo del mapa del Tube (9 agosto, v2) detrás de TODA pantalla de estación — cubre Survival
     Kit y las 7 en "Coming soon" con un solo cambio. Sin velo oscuro esta vez: Angel pidió el
     fondo "lo más claro posible" y la imagen ya viene en tonos crema/gris muy suaves — un velo
     oscuro encima la apagaba demasiado ("queda muy recargado"/"se pierde"), así que ahora se
     usa tal cual. Como consecuencia, todo el texto/tarjetas que antes vivían sueltos sobre el
     fondo oscuro de la app necesitaron su propio ajuste de contraste para este fondo claro (ver
     comentarios puntuales más abajo) — el header de arriba se dejó oscuro a propósito, como
     marco, así queda una franja oscura arriba y "papel" claro abajo. */
  #screen-station{align-items:stretch;
    background:url('rubberneckin-assets/covers/tube_bg.jpg') center/cover no-repeat;}
  .rk-station-banner{height:15vh;min-height:96px;width:100%;background-size:cover;
    background-position:center 22%;position:relative;flex-shrink:0;}
  .rk-station-banner::after{content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,10,26,.15),rgba(10,10,26,.85));}
  .rk-station-header{display:flex;align-items:center;gap:14px;padding:14px 20px;
    border-bottom:1px solid var(--border);background:var(--bg2);flex-wrap:wrap;}
  .rk-station-icon{font-size:30px;}
  .rk-station-title{font-family:'Orbitron',monospace;font-size:18px;font-weight:700;color:var(--gold2);}
  .rk-station-sub{font-family:'Rajdhani',sans-serif;font-size:13px;color:var(--muted);letter-spacing:1px;}
  .rk-back-btn{margin-left:auto;padding:9px 18px;background:transparent;border:1px solid var(--border);
    border-radius:10px;color:var(--muted);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;
    cursor:pointer;letter-spacing:1px;}
  .rk-back-btn:hover{border-color:var(--gold);color:var(--gold2);}
  /* Estos dos (header y back-btn) están DENTRO de .rk-station-header, que sigue con su propio
     fondo oscuro sólido (var(--bg2)) — no les afecta el cambio de fondo claro de abajo. */
  .rk-station-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 24px;text-align:center;gap:14px;}
  /* Colores oscuros a propósito (9 agosto v2) — antes eran claros, pensados para el fondo oscuro
     de la app; ahora este bloque vive sobre el mapa claro, así que necesitan contraste inverso. */
  .rk-skill-pill{display:inline-block;padding:5px 14px;border-radius:999px;background:rgba(245,158,11,.16);
    border:1px solid rgba(180,120,10,.4);color:#8a5a06;font-family:'Rajdhani',sans-serif;
    font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
  .rk-coming-soon{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;color:#1c1c30;}
  /* Fuente un poco más grande y con más peso (9 agosto v3) — el fondo quedó casi blanco puro,
     así que además del color oscuro, el texto necesita más presencia para no perderse. */
  /* Marco con fondo blanco (9 agosto v4) — a pedido de Angel: en vez de agrandar más la letra,
     un recuadro claro separa el texto del mapa de fondo detrás. */
  .rk-station-desc{max-width:440px;font-size:16px;font-weight:500;line-height:1.7;color:#3a3a52;
    background:rgba(255,255,255,.92);border:1px solid rgba(40,40,70,.12);border-radius:12px;
    padding:16px 20px;box-shadow:0 4px 16px rgba(20,20,40,.08);}

  /* ── Survival Kit — primera estación con mecánica real ──
     Rediseñado el 9 de agosto (2da ronda de feedback de Angel, ver comentario junto al JS):
     ya no hay picker de 5 misiones sueltas ni frase objetivo visible — ahora es una cadena de
     5 misiones que Oliver va presentando una por una, hablando (TTS) en vez de solo texto. */
  /* Contenedor que agrupa el panel decorativo + el contenido de la misión — es este el que la
     JS muestra/oculta (antes se togglaba directo #rk-sk-wrap); así el panel lateral entra y
     sale junto con el resto sin lógica JS aparte. */
  /* min-height:0 (10 agosto) — sin esto, un hijo flex:1 dentro de una columna de altura fija
     (.screen) crece para caber TODO su contenido en vez de quedar acotado al alto visible, y el
     overflow-y:auto de más adentro (.rk-sk-wrap) nunca llega a activarse — bug clásico de
     flexbox. Angel lo encontró en el catálogo de Electric Cinema (20 películas no entraban y no
     había scroll); mismo arreglo aplicado acá por consistencia, aunque Survival Kit no lo haya
     mostrado todavía (su contenido siempre fue corto). */
  .rk-sk-layout{display:none;flex:1;width:100%;min-height:0;}
  /* Panel decorativo (póster "Keep Calm and Carry On", 9 agosto) — solo en pantallas anchas
     (computador). En el celular no hay espacio para un "tercio izquierdo" sin tapar el
     contenido, así que se oculta entero bajo los 900px y la actividad ocupa todo el ancho,
     igual que antes. */
  .rk-sk-side{display:none;}
  @media (min-width:900px){
    .rk-sk-side{display:flex;align-items:center;justify-content:center;flex:0 0 30%;padding:24px;}
    .rk-sk-side img{width:100%;max-width:230px;border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.45);}
  }
  .rk-sk-wrap{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:28px 24px;gap:14px;overflow-y:auto;width:100%;max-width:640px;margin:0 auto;text-align:left;}
  /* Texto suelto directo sobre el fondo claro (sin tarjeta propia) — oscurecido igual que arriba. */
  .rk-sk-progress{font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;
    color:#5a5a75;text-transform:uppercase;}
  /* Cambiado el 9 agosto (3ra ronda): la burbuja de Oliver vivía en tarjeta oscura — funcionaba
     por contraste, pero Angel pidió el mismo marco blanco que ya destaca la descripción/
     transcript, para que todo el texto importante use el mismo lenguaje visual. */
  .rk-sk-oliver{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.92);
    border:1px solid rgba(40,40,70,.12);border-radius:12px;padding:14px;width:100%;
    box-shadow:0 4px 16px rgba(20,20,40,.08);}
  .rk-sk-oliver img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .rk-sk-oliver-name{font-weight:700;color:#8a5a06;font-size:13px;margin-bottom:4px;}
  .rk-sk-oliver-text{font-size:14px;font-weight:500;line-height:1.6;color:#2a2a40;}
  .rk-sk-hear-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:6px 12px;
    cursor:pointer;font-size:14px;flex-shrink:0;align-self:center;}
  .rk-sk-mic-row{display:flex;gap:8px;width:100%;}
  /* Antes era un lavado verde 10% transparente pensado para verse bien sobre fondo oscuro; sobre
     el mapa claro esa misma transparencia se veía lavada y sin fuerza — ahora más sólido. */
  .rk-sk-mic-btn{flex:1;padding:13px;background:rgba(16,185,129,.18);border:2px solid rgba(13,122,95,.5);
    border-radius:10px;color:#0d7a5f;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;}
  .rk-sk-mic-btn:disabled{opacity:.6;cursor:default;}
  .rk-sk-reset-btn{display:none;padding:13px 14px;background:var(--card2);border:2px solid var(--border);
    border-radius:10px;color:var(--muted);font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;}
  .rk-sk-transcript{font-size:14px;font-weight:500;color:#3a3a52;font-style:italic;min-height:18px;}
  .rk-sk-transcript:not(:empty){background:rgba(255,255,255,.92);border:1px solid rgba(40,40,70,.12);
    border-radius:10px;padding:10px 14px;box-shadow:0 4px 16px rgba(20,20,40,.08);}
  .rk-sk-actions{display:flex;gap:8px;width:100%;}
  .rk-sk-primary-btn{flex:1;padding:13px;background:var(--gold);border:none;border-radius:10px;
    color:#1a1a0a;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;cursor:pointer;}
  /* Antes transparente (se apoyaba en el fondo oscuro de la app para leerse) — ahora con fondo
     sólido claro propio, para que siga siendo un botón reconocible sobre el mapa claro. */
  .rk-sk-secondary-btn{padding:13px 16px;background:rgba(255,255,255,.75);border:1px solid rgba(40,40,70,.25);
    border-radius:10px;color:#3a3a55;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;}
  .rk-sk-secondary-btn:hover{border-color:var(--gold);color:#8a5a06;}
  /* Botón de arranque — más grande y destacado que un botón de acción normal (9 agosto, a pedido
     de Angel: "muy pequeño... lo haría más grande y destacado"), con brillo sutil para que se
     sienta como EL botón de la pantalla, no uno más. */
  .rk-sk-start-btn{width:100%;padding:22px;font-size:19px;
    box-shadow:0 8px 26px rgba(245,158,11,.45);letter-spacing:.5px;}
  /* Tarjeta blanca para texto suelto sobre el mapa (9 agosto) — a pedido de Angel: en vez de
     agrandar más la letra, un marco con fondo sólido claro separa el texto del mapa de fondo y
     se lee mejor sin competir con las líneas del mapa detrás. */
  .rk-sk-card{background:rgba(255,255,255,.92);border:1px solid rgba(40,40,70,.12);
    border-radius:12px;padding:14px 16px;box-shadow:0 4px 16px rgba(20,20,40,.08);}

  /* ── Abbey Road / Electric Cinema — estaciones de contenido fijo (9 agosto, ronda 4) ──
     Angel pidió migrar Singing y Watching desde "Coming soon" a contenido real, pero simple:
     nada de mic ni evaluación, todo escrito a mano (mismo perfil de riesgo bajo del Principio
     13 — cero contenido generado por IA acá). Reutiliza el mismo contenedor visual que Survival
     Kit (#rk-info-wrap usa la clase .rk-sk-wrap, .rk-sk-card, .rk-sk-actions, .rk-sk-primary-btn/
     .rk-sk-secondary-btn) — solo se agregan las piezas que faltaban: título/bajada, grilla de
     vocabulario y lista de datos curiosos (Electric Cinema). Ver rkRenderInfoStation() en el JS. */
  .rk-info-layout{display:none;flex:1;width:100%;min-height:0;}
  .rk-info-title{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:#8a5a06;margin-bottom:8px;}
  .rk-info-blurb{font-size:14px;font-weight:500;line-height:1.6;color:#2a2a40;}
  .rk-fact-list{margin:8px 0 0 18px;font-size:14px;font-weight:500;line-height:1.7;color:#2a2a40;}
  .rk-vocab-grid{display:grid;grid-template-columns:1fr;gap:8px;width:100%;}
  @media (min-width:560px){ .rk-vocab-grid{grid-template-columns:1fr 1fr;} }
  .rk-vocab-item{background:rgba(255,255,255,.92);border:1px solid rgba(40,40,70,.12);border-radius:10px;
    padding:10px 12px;box-shadow:0 4px 16px rgba(20,20,40,.08);}
  .rk-vocab-word{font-weight:700;color:#8a5a06;font-size:13px;}
  .rk-vocab-mean{font-size:12px;font-weight:500;color:#3a3a52;margin-top:2px;line-height:1.4;}
  /* Los botones de acción de Survival Kit son <button> — acá van sobre <a> (links externos a
     YouTube), por eso el reset de subrayado/alineación; el resto del look (fondo, borde,
     tipografía) lo heredan igual de .rk-sk-primary-btn/.rk-sk-secondary-btn. */
  .rk-info-layout a.rk-sk-primary-btn,.rk-info-layout a.rk-sk-secondary-btn{
    text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center;}

  /* ── Match Day / Mind the Gap — 18 agosto (Fase 1 del roadmap) ── */
  .rk-mc-option{display:block;width:100%;text-align:left;padding:11px 14px;margin-bottom:6px;
    background:rgba(255,255,255,.92);border:1px solid rgba(40,40,70,.12);border-radius:10px;
    color:#2a2a40;font-size:14px;font-weight:500;cursor:pointer;font-family:'Rajdhani',sans-serif;}
  .rk-mc-option:hover:not(:disabled){border-color:var(--gold);}
  .rk-mc-option:disabled{cursor:default;}
  .rk-mc-option.rk-correct{border-color:#0d7a5f;background:rgba(16,185,129,.18);font-weight:700;}
  .rk-mc-option.rk-wrong{border-color:#b91c1c;background:rgba(239,68,68,.14);}
  .rk-gap-text{font-size:14px;font-weight:500;line-height:2.1;color:#2a2a40;}
  .rk-gap-input{display:inline-block;width:110px;padding:4px 8px;margin:0 2px;
    border:1px solid rgba(40,40,70,.3);border-radius:6px;font-size:14px;
    font-family:'Rajdhani',sans-serif;text-align:center;background:rgba(255,255,255,.92);}
  .rk-gap-input.rk-correct{border-color:#0d7a5f;background:rgba(16,185,129,.18);}
  .rk-gap-input.rk-wrong{border-color:#b91c1c;background:rgba(239,68,68,.14);}
  .rk-gap-hint{font-size:12px;font-weight:700;color:#b91c1c;margin-left:2px;}
  .rk-gap-feedback{margin-top:10px;font-size:13px;color:#3a3a52;}
  .rk-gap-photo-link{font-size:12px;font-weight:700;color:#0d7a5f;margin-left:2px;text-decoration:none;
    border-bottom:1px dashed #0d7a5f;}
  .rk-gap-photo-link:hover{color:#08543f;}
  .rk-hunt-input{display:block;width:100%;box-sizing:border-box;padding:10px 12px;font-size:15px;
    font-family:'Rajdhani',sans-serif;border:1px solid rgba(40,40,70,.3);border-radius:8px;
    background:rgba(255,255,255,.92);text-align:center;}
  .rk-mystery-fuse{height:10px;border-radius:6px;background:rgba(40,40,70,.15);overflow:hidden;margin-top:8px;}
  .rk-mystery-fuse-fill{height:100%;background:linear-gradient(90deg,#d97706,#dc2626);transition:width .3s ease;}

  /* ── Electric Cinema — catálogo tipo Netflix (10 agosto) ── */
  .rk-cinema-cat-title{font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;
    color:#5a5a75;text-transform:uppercase;margin-top:4px;}
  .rk-cinema-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;}
  @media (min-width:560px){ .rk-cinema-grid{grid-template-columns:1fr 1fr 1fr;} }
  .rk-cinema-card{background:rgba(255,255,255,.92);border:1px solid rgba(40,40,70,.12);border-radius:10px;
    padding:12px;box-shadow:0 4px 16px rgba(20,20,40,.08);cursor:pointer;text-align:left;
    font-family:'Rajdhani',sans-serif;transition:border-color .15s,transform .15s;}
  .rk-cinema-card:hover{border-color:var(--gold);transform:translateY(-1px);}
  .rk-cinema-card-title{font-weight:700;font-size:13px;color:#2a2a40;line-height:1.3;}
  .rk-cinema-card-year{font-size:11px;color:#8a5a06;margin-top:3px;}

  /* ── Debug/test badge (recordatorio de que es build de prueba) ── */
  .rk-test-badge{position:fixed;bottom:10px;right:12px;z-index:50;font-family:'Rajdhani',sans-serif;
    font-size:11px;letter-spacing:1px;color:rgba(148,163,184,.5);pointer-events:none;}
</style>
<!-- Precarga la librería de YouTube desde que se abre el link (esto sí está permitido sin
     clic — solo baja un script, no reproduce nada) para que cuando Angel toque "Tap to
     begin" el audio arranque casi al instante en vez de con el desfase de tener que
     cargar la librería recién en ese momento. -->
<script src="https://www.youtube.com/iframe_api" async></script>
</head>
<body>

<!-- TEMA ACTIVO — declarado acá arriba (no más abajo, en el script grande) porque Portada 2
     necesita saber el tema ANTES de pintarse — es HTML estático, no algo que arme el JS grande

// ══ Audio de bienvenida (Sección 2.1 del concepto) ══
// Nunca se aloja el audio — se referencia un video de YouTube (el audio lo sirve YouTube,
// no la app), invisible, sin controles. Angel: pega acá el ID del video de "Rubberneckin'"
// (Elvis Presley) que quieras usar — con esto vacío, el módulo funciona igual, solo sin música.
// 20 de agosto: theme-aware — un ID distinto por tema (RK_ACTIVE_THEME, definido más abajo).
// Fiestas Patrias abre con "La Consentida" (himno del 18); Halloween abre con el remix
// "Undead Tombstone" de "Spooky, Scary Skeletons" (Angel: "están buenos de entrada"). Full
// usa la misma de Neutral (Rubberneckin', identidad del módulo todo el año) hasta que se
// decida otra cosa. rkCurrentYoutubeId() resuelve cuál usar en cada momento.
const RK_YOUTUBE_IDS = {
  neutral: 'RG8OgltHB_4',          // Rubberneckin' — Elvis Presley
  fiestas_patrias: 'Wy9MSfHQT8A',  // La Consentida
  halloween: '2mKN6PDZTmc',        // Spooky, Scary Skeletons (Undead Tombstone Remix)
  full: 'RG8OgltHB_4',
};
function rkCurrentYoutubeId(){
  return RK_YOUTUBE_IDS[RK_ACTIVE_THEME] || RK_YOUTUBE_IDS.neutral;
}
let _rkPlayer = null;       // instancia de YT.Player una vez creada
let _rkYTApiReady = false;  // true cuando el script externo de YouTube ya cargó

// Se usa la API oficial de YouTube (no un iframe "a mano" con postMessage a ciegas) porque
// necesitamos saber con certeza CUÁNDO el reproductor ya está listo para recibir comandos
// (evento onReady) en vez de adivinar un tiempo de espera fijo, que es frágil y depende de
// la velocidad de conexión de cada uno. Arranca muteado (eso el navegador siempre lo
// permite) y se desmutea apenas el reproductor avisa que está listo — todavía dentro de la
// misma interacción del usuario. Cualquier error queda registrado en la consola (F12) con
// el prefijo "Rubberneckin:" para poder diagnosticar sin adivinar.
function rkLoadYouTubeApi(onReady){
  if(window.YT && window.YT.Player){ onReady(); return; }
  const prevCallback = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = () => { _rkYTApiReady = true; if(prevCallback) prevCallback(); onReady(); };
  if(!document.getElementById('rk-yt-api-script')){
    const tag = document.createElement('script');
    tag.id = 'rk-yt-api-script';
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = () => rkDebugLog('no se pudo cargar la API de YouTube (¿bloqueada por un adblock/red?).');
    document.head.appendChild(tag);
  }
}
function rkPlayWelcomeAudio(){
  if(!rkCurrentYoutubeId() || _rkPlayer) return;
  const holder = document.createElement('div');
  holder.id = 'rk-yt-holder';
  holder.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;';
  document.body.appendChild(holder);
  rkLoadYouTubeApi(() => {
    try{
      _rkPlayer = new YT.Player('rk-yt-holder', {
        videoId: rkCurrentYoutubeId(),
        playerVars:{autoplay:1, mute:1, controls:0, modestbranding:1, playsinline:1, rel:0},
        events:{
          onReady: e => {
            try{ e.target.unMute(); e.target.setVolume(70); e.target.playVideo(); }
            catch(err){ rkDebugLog('audio onReady falló — ' + err); }
            rkUpdateAudioButtonIcon();
          },
          onError: e => rkDebugLog('YouTube player error, código ' + e.data)
        }
      });
    }catch(err){ rkDebugLog('no se pudo crear el reproductor — ' + err); }
  });
}
function rkUnmuteWelcomeAudio(){
  if(!_rkPlayer){ rkPlayWelcomeAudio(); return; }
  try{ _rkPlayer.unMute(); _rkPlayer.setVolume(70); _rkPlayer.playVideo(); }
  catch(err){ rkDebugLog('unmute manual falló — ' + err); }
}
function rkStopWelcomeAudio(){
  if(_rkPlayer){ try{ _rkPlayer.stopVideo(); }catch(e){} }
}
// Ícono del botón 🔊/🔇 del menú, reflejando el estado real del reproductor.
function rkUpdateAudioButtonIcon(){
  const btn = document.getElementById('rk-audio-btn');
  if(!btn || !_rkPlayer) return;
  try{ btn.textContent = _rkPlayer.isMuted() ? '🔇' : '🔊'; }catch(e){}
}
// Botón del menú — antes de que arranque, lo arranca (respaldo si el autoplay falló);
// una vez sonando, funciona como mute/unmute real, útil para cortar la música al entrar
// a una estación con Speaking o Listening donde de verdad molesta.
function rkToggleAudioManual(){
  if(!_rkPlayer){ rkPlayWelcomeAudio(); return; }
  try{
    if(_rkPlayer.isMuted()){ _rkPlayer.unMute(); _rkPlayer.setVolume(70); _rkPlayer.playVideo(); }
    else{ _rkPlayer.mute(); }
  }catch(err){ rkDebugLog('toggle de audio falló — ' + err); }
  rkUpdateAudioButtonIcon();
}

// ══ Pantalla completa ══
// Igual que el audio, el navegador solo deja pedir fullscreen como resultado directo de
// un click real del usuario — por eso se dispara en el mismo tap de Portada 1 y también
// está disponible como botón manual (⛶) en el menú. Si falla o no está disponible (ej.
// Safari de iPhone/iPad no soporta este API), queda registrado en consola (F12) con el
// prefijo "Rubberneckin:" y el módulo sigue funcionando normal, solo sin ocultar los
// bordes del navegador.
function rkEnterFullscreen(){
  if(document.fullscreenElement || document.webkitFullscreenElement){
    console.warn('Rubberneckin: ya está en fullscreen.');
    return;
  }
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if(!req){ rkDebugLog('Fullscreen API no disponible en este navegador.'); return; }
  try{
    const p = req.call(el);
    if(p && p.catch) p.catch(err => rkDebugLog('fullscreen rechazado — ' + err));
  }catch(e){ rkDebugLog('fullscreen falló — ' + e); }
}
document.addEventListener('fullscreenerror', () => rkDebugLog('fullscreenerror — el navegador rechazó el pedido de pantalla completa.'));

// ══ Navegación entre pantallas ══
const RK_COVER_SCREENS = ['screen-cover1','screen-cover2','screen-cover3'];
function rkGoto(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  // Controles globales (⛶/🔊): ocultos solo durante la secuencia de portadas — a partir del
  // menú (y dentro de cada estación/misión) siempre visibles, a pedido de Angel tras notar que
  // el botón de mute desaparecía justo al entrar a Survival Kit.
  const controls = document.getElementById('rk-global-controls');
  if(controls) controls.classList.toggle('rk-hidden', RK_COVER_SCREENS.includes(id));
}

let _rkTimer = null;
function rkClearTimer(){ if(_rkTimer){clearTimeout(_rkTimer);_rkTimer=null;} }

// Portada 1 requiere tap explícito (no auto-avanza) — fullscreen y audio necesitan un
// gesto de click real del usuario para funcionar en el navegador, así que ambos se
// disparan justo acá. Fullscreen va primero y solo (sin nada más en el mismo instante) —
// crear el reproductor de YouTube justo al lado, en el mismo tick, parece ser lo que
// hacía que el navegador ignorara el pedido de fullscreen en algunos casos; ahora el
// audio se dispara con un pequeño delay (sigue contando como parte del mismo gesto).
//
// Efecto "IMAX" (a pedido de Angel): en vez de saltar a Portada 2 apenas se dispara el
// fullscreen, nos quedamos en Portada 1 — ya expandida a pantalla completa, sin bordes
// del navegador — unos segundos más, para que se sienta como una expansión real, antes
// de recién ahí avanzar. Un segundo tap sobre Portada 1 salta ese tramo de inmediato
// (mismo patrón de "tap para saltar" que el resto de las portadas).
let _rkCover1Tapped = false;
function rkTapCover1(){
  if(_rkCover1Tapped){ rkClearTimer(); rkAdvanceToCover2(); return; }
  _rkCover1Tapped = true;
  const hint = document.getElementById('rk-cover1-hint');
  if(hint) hint.style.display = 'none';
  rkEnterFullscreen();
  setTimeout(rkPlayWelcomeAudio, 50);
  // 3000ms → 4500ms (10 agosto, a pedido de Angel): el aviso nativo del navegador ("Presiona ESC
  // para salir de pantalla completa") se queda unos segundos tras entrar a fullscreen y alcanzaba
  // a invadir la Portada 2 (las postales) — rompía la inmersión justo cuando más importa. Más
  // tiempo acá le da margen a que ese aviso se desvanezca solo antes de avanzar.
  _rkTimer = setTimeout(rkAdvanceToCover2, 4500);
}
function rkAdvanceToCover2(){
  rkClearTimer();
  rkGoto('screen-cover2');
  _rkTimer = setTimeout(rkAdvanceToCover3, 5000);
}
function rkAdvanceToCover3(){
  rkClearTimer();
  rkGoto('screen-cover3');
  _rkTimer = setTimeout(rkEnterMenu, 5000);
}
function rkEnterMenu(){
  rkClearTimer();
  // A pedido de Angel (tras probar): la música sigue sonando de fondo, independiente
  // de la pantalla en la que se esté — ya no se corta al llegar al menú.
  sessionStorage.setItem('rk_intro_seen','1');
  rkGoto('screen-menu');
}

let rkCurrentStation = null;

function rkEnterStation(id){
  const st = RK_STATIONS.find(s=>s.id===id);
  if(!st) return;
  rkCurrentStation = st;
  const seenKey = 'rk_station_seen_' + id;
  if(sessionStorage.getItem(seenKey) === '1'){
    rkRenderStation(st);
    rkGoto('screen-station');
  } else {
    document.getElementById('rk-postcard-img').src = st.img;
    rkGoto('screen-postcard');
    rkClearTimer();
    _rkTimer = setTimeout(rkSkipPostcard, 5000);
  }
}
function rkSkipPostcard(){
  rkClearTimer();
  if(rkCurrentStation) sessionStorage.setItem('rk_station_seen_' + rkCurrentStation.id, '1');
  rkRenderStation(rkCurrentStation);
  rkGoto('screen-station');
}
function rkRenderStation(st){
  if(!st) return;
  document.getElementById('rk-station-banner').style.backgroundImage = `url('${st.img}')`;
  document.getElementById('rk-station-icon').textContent = st.icon;
  document.getElementById('rk-station-title').textContent = st.name;
  document.getElementById('rk-station-sub').textContent = st.sub;
  document.getElementById('rk-station-skill').textContent = st.skill;
  document.getElementById('rk-station-desc').textContent = st.desc;

  // Survival Kit (mecánica real) y Abbey Road/Electric Cinema (contenido fijo, 9 agosto ronda 4)
  // tienen su propio layout. Las 5 estaciones restantes siguen mostrando el bloque genérico
  // "Coming soon" (#rk-station-body) sin ningún cambio.
  const isSurvival = st.id === 'survival_kit';
  const isInfo = ['abbey_road','electric_cinema','match_day','mind_the_gap','scavenger_hunt','mystery_picture','stop_look_and_listen'].includes(st.id);
  document.getElementById('rk-station-body').style.display = (isSurvival || isInfo) ? 'none' : 'flex';
  document.getElementById('rk-sk-layout').style.display = isSurvival ? 'flex' : 'none';
  document.getElementById('rk-info-layout').style.display = isInfo ? 'flex' : 'none';
  if(isSurvival){ rkMicPrewarm(); rkSkShowIntro(); }
  if(isInfo){ rkRenderInfoStation(st.id); }
}

// Ficha de una canción — mismo contenido/formato de siempre, solo que ahora toma el id en vez
// de un objeto fijo único, y suma la sección "Did you know?" (facts) que ya usa Electric Cinema.
// "← All Songs" vuelve a la década desde la que se entró (o al nivel superior si venía del hub,
// caso de la canción flagship 'rubberneckin' que no vive en ninguna década del catálogo).
function rkRenderAbbeySong(sid){
  const wrap = document.getElementById('rk-info-wrap');
  const s = RK_ABBEY_SONGS[sid];
  if(!s) return;
  const factsHtml = (s.facts && s.facts.length) ? `
    <div class="rk-sk-card"><div class="rk-info-title" style="font-size:14px">🎶 Did you know?</div><ul class="rk-fact-list">${s.facts.map(f => `<li>${rkEscapeHtml(f)}</li>`).join('')}</ul></div>` : '';
  wrap.innerHTML = `
    <div class="rk-sk-card"><div class="rk-info-title">${rkEscapeHtml(s.title)}</div><div class="rk-info-blurb">${rkEscapeHtml(s.blurb)}</div></div>
    <div class="rk-vocab-grid">${s.vocab.map(v => `<div class="rk-vocab-item"><div class="rk-vocab-word">${rkEscapeHtml(v.w)}</div><div class="rk-vocab-mean">${rkEscapeHtml(v.m)}</div></div>`).join('')}</div>
    ${factsHtml}
    <div class="rk-sk-actions">
      <a class="rk-sk-primary-btn" href="${rkAbbeyYtUrl(s)}" target="_blank" rel="noopener">🎵 Listen &amp; Sing Along on YouTube Music</a>
      <button class="rk-sk-secondary-btn" onclick="${_rkAbbeyLastDecadeIdx === null ? 'rkRenderAbbeyASide()' : `rkRenderAbbeyDecade(${_rkAbbeyLastDecadeIdx})`}">← All Songs</button>
    </div>`;
}

// 18 agosto (mismo día): Angel — "sencillo pero extenso, que no se quemen pronto". En vez de
// jugar siempre las mismas 5 preguntas en el mismo orden, cada partida elige al azar
// (aleatoriedad controlada, rkShuffle) un subset de 5 preguntas del pool completo de la
// categoría (que ahora tiene ~15). La sesión de juego sigue siendo corta y liviana, pero el
// pool grande hace que jugar varias veces se sienta distinto cada vez. Mismo principio a
// aplicar en Mystery Picture, Stop Look & Listen y Scavenger Hunt cuando se construyan.
const RK_MATCHDAY_QUIZ_LENGTH = 5;
function rkStartMatchQuiz(catId){
  const cat = _rkMatchAllCategories().find(c => c.id === catId);
  if(!cat) return;
  const pool = rkShuffle(cat.questions).slice(0, Math.min(RK_MATCHDAY_QUIZ_LENGTH, cat.questions.length));
  _rkMatchState = {catId, pool, qIdx:0, score:0, answered:false, used5050:false, usedOliver:false, eliminated:null};
  rkRenderMatchQuiz();
}
function rkRenderMatchQuiz(){
  const s = _rkMatchState;
  const cat = _rkMatchAllCategories().find(c => c.id === s.catId);
  const q = s.pool[s.qIdx];
  const wrap = document.getElementById('rk-info-wrap');
  wrap.innerHTML = `
    <div class="rk-sk-card">
      <div class="rk-info-title">${rkEscapeHtml(cat.label)}</div>
      <div class="rk-info-blurb" style="font-size:12px">Question ${s.qIdx+1} of ${s.pool.length} · Score: ${s.score}</div>
      <div class="rk-info-blurb" style="font-weight:700;margin-top:8px">${rkEscapeHtml(q.q)}</div>
      <div id="rk-match-oliver-note"></div>
    </div>
    <div id="rk-match-options">
      ${q.options.map((opt,oi) => `<button class="rk-mc-option" id="rk-match-o${oi}" onclick="rkMatchAnswer(${oi})"${s.eliminated && s.eliminated.includes(oi) ? ' disabled style="opacity:.35"' : ''}>${rkEscapeHtml(opt)}</button>`).join('')}
    </div>
    <div class="rk-sk-actions">
      <button class="rk-sk-secondary-btn" onclick="rkMatchUse5050()"${s.used5050 || s.answered ? ' disabled style="opacity:.4"' : ''}>🔀 50/50</button>
      <button class="rk-sk-secondary-btn" onclick="rkMatchCallOliver()"${s.usedOliver || s.answered ? ' disabled style="opacity:.4"' : ''}>📞 Call Oliver</button>
    </div>
    <div class="rk-sk-actions">
      <button class="rk-sk-secondary-btn" onclick="rkRenderMatchDay()">← Back to topics</button>
    </div>`;
}
function rkMatchUse5050(){
  const s = _rkMatchState;
  if(!s || s.used5050 || s.answered) return;
  const q = s.pool[s.qIdx];
  const wrongIdx = q.options.map((_,i) => i).filter(i => i !== q.answer);
  const toRemove = rkShuffle(wrongIdx)[0]; // aleatoriedad controlada (Fisher-Yates), no Math.random directo
  s.used5050 = true;
  s.eliminated = [toRemove];
  rkRenderMatchQuiz();
}
function rkMatchCallOliver(){
  const s = _rkMatchState;
  if(!s || s.usedOliver || s.answered) return;
  s.usedOliver = true;
  rkRenderMatchQuiz();
  const q = s.pool[s.qIdx];
  const note = document.getElementById('rk-match-oliver-note');

function rkMatchAnswer(oi){
  const s = _rkMatchState;
  if(!s || s.answered) return; // candado real, no solo visual — mismo criterio del fix de Q&A Trivia en JTL
  s.answered = true;
  const cat = _rkMatchAllCategories().find(c => c.id === s.catId);
  const q = s.pool[s.qIdx];
  if(oi === q.answer) s.score++;
  q.options.forEach((_,i) => {
    const btn = document.getElementById(`rk-match-o${i}`);
    if(!btn) return;
    btn.disabled = true;
    btn.style.opacity = '';
    btn.style.outline = '';
    if(i === q.answer) btn.classList.add('rk-correct');
    else if(i === oi) btn.classList.add('rk-wrong');
  });
  const wrap = document.getElementById('rk-info-wrap');
  const label = (s.qIdx + 1 < s.pool.length) ? 'Next question →' : 'See final score';
  wrap.insertAdjacentHTML('beforeend', `<div class="rk-sk-actions"><button class="rk-sk-primary-btn" onclick="rkMatchNextQuestion()">${label}</button></div>`);
}
function rkMatchNextQuestion(){
  const s = _rkMatchState;
  s.qIdx++;
  s.answered = false;
  s.eliminated = null;
  if(s.qIdx >= s.pool.length) rkRenderMatchResult();
  else rkRenderMatchQuiz();
}
function rkRenderMatchResult(){
  const s = _rkMatchState;
  const cat = _rkMatchAllCategories().find(c => c.id === s.catId);

      <button class="rk-sk-secondary-btn" onclick="rkRenderMatchDay()">← Back to topics</button>
    </div>`;
}

function rkHuntMcAnswer(oi){

  w.options.forEach((_,i) => {

function rkStartMystery(){

  rkRenderMysteryStep();

function rkRenderMysteryStep(){
  const s = _rkMysteryState;
  const m = s.mystery;
  const total = m.clues.length;
  const pct = Math.round(((s.clueIdx + 1) / total) * 100);
  const cluesShown = m.clues.slice(0, s.clueIdx + 1);
  const wrap = document.getElementById('rk-info-wrap');
  wrap.innerHTML = `
    <div class="rk-sk-card">
      <div class="rk-info-title">📦 Mystery Box</div>

      <input type="text" class="rk-hunt-input" id="rk-mystery-guess" placeholder="Know it? Type your guess..." style="margin-top:10px">
    </div>
    <div class="rk-sk-actions">
      ${s.clueIdx < total - 1 ? `<button class="rk-sk-secondary-btn" onclick="rkMysteryNextClue()">Next clue →</button>` : ''}

let _rkSLLState = null; // {catId, pool, qIdx, score, answered, used5050, usedOliver, eliminated, playing}
function rkRenderSLL(){
  rkStopAllTts(); // "← Back to topics" puede tocarse a mitad de un fragmento/diálogo sonando
  _rkSLLState = null;

}
const RK_SLL_QUIZ_LENGTH = 4; // piloto: pool chico (4 por categoría), se juega completo por ahora
function rkStartSLLQuiz(catId){
  const cat = _rkSLLAllCategories().find(c => c.id === catId);
  if(!cat) return;
  const pool = rkShuffle(cat.items).slice(0, Math.min(RK_SLL_QUIZ_LENGTH, cat.items.length));
  _rkSLLState = {catId, pool, qIdx:0, score:0, answered:false, used5050:false, usedOliver:false, eliminated:null, playing:false};
  rkRenderSLLQuiz();
}
function rkRenderSLLQuiz(){
  const s = _rkSLLState;
  const cat = _rkSLLAllCategories().find(c => c.id === s.catId);
  const item = s.pool[s.qIdx];
  const wrap = document.getElementById('rk-info-wrap');

      <div id="rk-sll-oliver-note"></div>

    <div id="rk-sll-options">
      ${item.options.map((opt,oi) => `<button class="rk-mc-option" id="rk-sll-o${oi}" onclick="rkSLLAnswer(${oi})"${s.eliminated && s.eliminated.includes(oi) ? ' disabled style="opacity:.35"' : ''}>${rkEscapeHtml(opt)}</button>`).join('')}
    </div>
    <div class="rk-sk-actions">

      <button class="rk-sk-secondary-btn" onclick="rkSLLAskOliver()"${s.usedOliver || s.answered ? ' disabled style="opacity:.4"' : ''}>📞 Ask Oliver</button>

      <button class="rk-sk-secondary-btn" onclick="rkRenderSLL()">← Back to topics</button>

// Reproduce el fragmento — un solo narrador neutro, o (Dialogues) varias líneas en secuencia
// alternando dos voces distintas. `await` en cada línea asegura que no se solapen.
async function rkSLLPlayFragment(){
  const s = _rkSLLState;
  if(!s || s.playing) return;
  const item = s.pool[s.qIdx];
  const btn = document.getElementById('rk-sll-play-btn');
  s.playing = true;
  if(btn){ btn.disabled = true; btn.textContent = '🔊 Playing...'; }
  if(item.lines){
    for(const line of item.lines){
      const voice = line.v === 'A' ? RK_SLL_VOICE_A : RK_SLL_VOICE_B;
      await rkTtsSpeakVoice(line.t, voice.voice, voice.instructions);
    }
  } else {
    await rkTtsSpeakVoice(item.fragment, 'onyx', RK_NARRATOR_TTS_INSTRUCTIONS);
  }
  s.playing = false;
  if(btn){ btn.disabled = false; btn.textContent = '🔁 Listen again'; }
}
function rkSLLUse5050(){
  const s = _rkSLLState;
  if(!s || s.used5050 || s.answered) return;
  const item = s.pool[s.qIdx];
  const wrongIdx = item.options.map((_,i) => i).filter(i => i !== item.answer);
  const toRemove = rkShuffle(wrongIdx)[0]; // aleatoriedad controlada (Fisher-Yates), no Math.random directo
  s.used5050 = true;
  s.eliminated = [toRemove];
  rkRenderSLLQuiz();
}
function rkSLLAskOliver(){
  const s = _rkSLLState;
  if(!s || s.usedOliver || s.answered) return;
  s.usedOliver = true;
  rkRenderSLLQuiz();
  const item = s.pool[s.qIdx];
  const note = document.getElementById('rk-sll-oliver-note');
  if(note) note.innerHTML = `<div class="rk-info-blurb" style="margin-top:6px;font-style:italic">📞 Oliver: "Hmm, let me think... I'm sure it's ${rkEscapeHtml(item.options[item.answer])}!"</div>`;
  const btn = document.getElementById(`rk-sll-o${item.answer}`);
  if(btn) btn.style.outline = '3px solid #f59e0b';
}
function rkSLLAnswer(oi){
  const s = _rkSLLState;
  if(!s || s.answered) return; // candado real, no solo visual — mismo criterio del fix de Q&A Trivia en JTL
  s.answered = true;
  const item = s.pool[s.qIdx];
  if(oi === item.answer) s.score++;
  item.options.forEach((_,i) => {
    const btn = document.getElementById(`rk-sll-o${i}`);
    if(!btn) return;
    btn.disabled = true;
    btn.style.opacity = '';
    btn.style.outline = '';
    if(i === item.answer) btn.classList.add('rk-correct');
    else if(i === oi) btn.classList.add('rk-wrong');
  });
  const wrap = document.getElementById('rk-info-wrap');
  const label = (s.qIdx + 1 < s.pool.length) ? 'Next question →' : 'See final score';
  wrap.insertAdjacentHTML('beforeend', `<div class="rk-sk-actions"><button class="rk-sk-primary-btn" onclick="rkSLLNextQuestion()">${label}</button></div>`);
}
function rkSLLNextQuestion(){
  const s = _rkSLLState;
  s.qIdx++;
  s.answered = false;
  s.eliminated = null;
  if(s.qIdx >= s.pool.length) rkRenderSLLResult();
  else rkRenderSLLQuiz();
}
function rkRenderSLLResult(){
  const s = _rkSLLState;
  const cat = _rkSLLAllCategories().find(c => c.id === s.catId);
  const wrap = document.getElementById('rk-info-wrap');
  wrap.innerHTML = `
    <div class="rk-sk-card">
      <div class="rk-info-title">${cat.icon} ${rkEscapeHtml(cat.label)}</div>
      <div class="rk-info-blurb" style="font-weight:700">Final score: ${s.score} / ${s.pool.length}</div>
    </div>
    <div class="rk-sk-actions">
      <button class="rk-sk-primary-btn" onclick="rkStartSLLQuiz('${cat.id}')">🔄 Play again</button>
      <button class="rk-sk-secondary-btn" onclick="rkRenderSLL()">← Back to topics</button>
    </div>`;
}

// Fisher-Yates real (Principio 9) — un random ingenuo sobre una lista de 5 se siente "rachado"
// (misma misión dos veces seguidas, por ejemplo); esto sí garantiza una mezcla pareja.
function rkShuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

    }catch(e){
      tx.textContent = 'Mic not available — check permissions.';
      btn.disabled = false; btn.style.background = 'rgba(16,185,129,.1)'; btn.style.borderColor = 'rgba(16,185,129,.3)'; btn.textContent = '🎤 Record your try';
      resetBtn.style.display = 'none';
      return;
    }
    btn.disabled = false;
    setTimeout(() => {
      if(rkMicIsRecording()){ btn.style.background = 'rgba(239,68,68,.2)'; btn.style.borderColor = '#ef4444'; btn.textContent = '🔴 Recording — speak now!'; }
    }, 900);
  } else {
    btn.style.background = 'rgba(16,185,129,.1)'; btn.style.borderColor = 'rgba(16,185,129,.3)';
    btn.textContent = '🎤 Record your try'; btn.disabled = true;
    resetBtn.style.display = 'none';
    tx.textContent = 'Transcribing...';
    const text = await rkMicStopAndTranscribe();
    _rkSkTranscript = text || '';
    btn.disabled = false;
    if(text){ tx.textContent = `"${text}"`; rkSkGetFeedback(); }
    else{ tx.textContent = '(no speech detected — try again)'; }
  }
}

function rkSkMicReset(){
  if(!rkMicReset()) return;
  const btn = document.getElementById('rk-sk-mic-btn');
  const resetBtn = document.getElementById('rk-sk-reset-btn');
  const tx = document.getElementById('rk-sk-transcript');
  btn.style.background = 'rgba(16,185,129,.1)'; btn.style.borderColor = 'rgba(16,185,129,.3)'; btn.textContent = '🎤 Record your try';
  resetBtn.style.display = 'none';
  tx.textContent = '';
  _rkSkTranscript = '';
  document.getElementById('rk-sk-oliver-area').innerHTML = '';
}

function rkSkGetFeedback(){
  if(!_rkSkCurrent) return;
  const area = document.getElementById('rk-sk-oliver-area');
  const oliverHtml = (inner, replay) => `<div class="rk-sk-oliver">
      <img src="Avatar/oliver-blackwood.png" alt="Oliver Blackwood">
      <div><div class="rk-sk-oliver-name">Oliver Blackwood</div><div class="rk-sk-oliver-text">${inner}</div></div>
      ${replay ? `<button class="rk-sk-hear-btn" onclick="rkSkReplay()" title="Hear it">▶</button>` : ''}
    </div>`;
  area.innerHTML = oliverHtml('Reading what you said...', false);
  const prompt = `You are Oliver Blackwood, a friendly Ravenclaw student from Hogwarts, giving quick spoken-English feedback to a Chilean kid (somewhere between 9 and 12 years old) practicing survival English phrases for a trip to London. You're relaxed and easygoing about it — this is meant to feel like a fun chat, never like a test.

SETTING (stay strictly inside this): present-day London, England. If money/currency comes up for any reason, it is always pounds sterling (£), never dollars.

Scenario: ${_rkSkCurrent.context}
One EXAMPLE of a natural way to respond (this is just ONE possible answer, NOT the only correct one — it's here only so you know roughly what kind of response fits the situation): "${_rkSkCurrent.target}"
What they actually said (transcribed with Whisper from their spoken audio): "${_rkSkTranscript}"

GRADING PHILOSOPHY — read this carefully, it matters: you must distinguish between COMMUNICATION SUCCESS and LANGUAGE PERFECTION. Your job is to judge the former, never the latter. This is an open-ended real-life situation, not a fill-in-the-blank quiz. Many different responses are equally correct — ordering a different food or drink than the example, giving a different (but real and coherent) reason for visiting London, asking a question with different wording. Judge ONLY whether what they said is clear, grammatically reasonable, and makes sense as a response to the scenario above — NEVER mark something as wrong or "not quite it" just because it differs from the example phrase's specific content. Do not steer them toward the example's exact words or details (the exact food, the exact reason, the exact wording) — any sensible content is a correct answer. If what they said is already clear, grammatical, and appropriate, just celebrate it — do not suggest a "simpler" or "more natural" alternative purely because it's shorter or closer to the example; that's discouraging for something that was already right, and it's the single biggest thing to avoid.

You must NEVER:
- Invent places, facts, or trivia beyond this specific scenario — you are reacting to their attempt, not teaching new facts.
- Introduce any currency other than pounds sterling (£).
- Treat the example phrase as "the correct answer" — it's one option among many, see grading philosophy above.
- Repeat, quote, or otherwise engage with content that is off-topic, nonsensical, or inappropriate — if the transcript is any of those, just give a light, friendly nudge back to the task (e.g. "Let's give it another try, what would you say if...").
- Scold, lecture, moralize, or explain why something was wrong to say.
- Use bad language yourself, no matter what the transcript contains.
- Break character as Oliver Blackwood, or mention that you are an AI.

Give warm, encouraging feedback in 2-3 short sentences, in simple English. Do NOT comment on pronunciation or accent — you only have a text transcript, not audio, so that information doesn't exist. Only offer a corrected version if there's a genuine grammar or clarity problem with what THEY said (correcting their own idea, never swapping it for the example's content) — and even then, keep it light and quick, not a lecture. Keep it casual and relaxed, like a friendly older kid, never like a teacher grading an exam. Reply with plain text only, no JSON, no markdown.`;
  rkCallClaude(prompt, 300)
    .then(text => {
      const clean = text.trim();
      _rkSkLastSpoken = clean;
      area.innerHTML = oliverHtml(rkEscapeHtml(clean), true) + rkSkActionsHtml();
      rkTtsSpeak(clean);
    })
    .catch(() => {
      const msg = "Oops — I couldn't reach the library right now. Try again in a moment!";
      area.innerHTML = oliverHtml(msg, false) + rkSkActionsHtml();
    });
}

function rkSkActionsHtml(){
  const isLast = _rkSkIndex >= _rkSkOrder.length - 1;
  return `<div class="rk-sk-actions">
    <button class="rk-sk-secondary-btn" onclick="rkSkRenderMission()">🔄 Try again</button>
    <button class="rk-sk-primary-btn" onclick="${isLast ? 'rkSkCycleComplete()' : 'rkSkNext()'}">${isLast ? 'Finish 🎉' : 'Continue →'}</button>
  </div>`;
}

function rkSkNext(){
  _rkSkIndex++;
  rkSkRenderMission();
}

function rkSkCycleComplete(){
  if(rkMicIsRecording()) rkMicReset();
  const msg = `Brilliant! You made it through all ${_rkSkOrder.length} missions. Want to play another round, or head back to the map?`;
  _rkSkLastSpoken = msg;
  const wrap = document.getElementById('rk-sk-wrap');
  wrap.innerHTML = `
    <div class="rk-sk-oliver">
      <img src="Avatar/oliver-blackwood.png" alt="Oliver Blackwood">
      <div><div class="rk-sk-oliver-name">Oliver Blackwood</div><div class="rk-sk-oliver-text">${msg}</div></div>
      <button class="rk-sk-hear-btn" onclick="rkSkReplay()" title="Hear it">▶</button>
    </div>
    <div class="rk-sk-actions">
      <button class="rk-sk-secondary-btn" onclick="rkBackToMap()">🗺️ Back to map</button>
      <button class="rk-sk-primary-btn" onclick="rkSkStartCycle()">🔁 Play another round</button>
    </div>`;
  rkTtsSpeak(msg);
}

// ── Mic/Whisper — mismo patrón que micStart()/micStopAndTranscribe()/micReset() de index.html
// (línea ~932), re-implementado acá porque este archivo no comparte script con index.html.
// Mismo endpoint POST /api/transcribe, sin tocarlo.
//
// Precalentado (9 de agosto — feedback real de Fer/Angel: "hablo y no se empieza a grabar").
// Causa real: getUserMedia() es async, así que entre apretar el botón y que el micrófono
// realmente empiece a capturar pasa una fracción de segundo — si el niño habla apenas ve el
// botón rojo, esas primeras palabras se pierden. Solución: pedir el permiso y abrir el stream
// UNA VEZ al entrar a Survival Kit (rkMicPrewarm, llamado desde rkRenderStation), y reutilizar
// ese mismo stream en cada grabación de la sesión — así rkMicStart() ya no espera a
// getUserMedia y el MediaRecorder arranca prácticamente al instante. Se libera recién al salir
// de la estación (rkMicRelease, desde rkBackToMap), no después de cada grabación individual.
let _rkMicRecorder = null, _rkMicChunks = [], _rkMicStream = null, _rkMicBusy = false;
function rkMicIsRecording(){ return !!(_rkMicRecorder && _rkMicRecorder.state === 'recording'); }
async function rkMicPrewarm(){
  if(_rkMicStream || _rkMicBusy) return;
  try{ _rkMicStream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ /* silencioso — si el permiso se deniega acá, rkMicStart() lo vuelve a pedir al grabar */ }
}
async function rkMicStart(){
  if(_rkMicBusy || rkMicIsRecording()) return;
  _rkMicBusy = true;
  try{
    if(!_rkMicStream || !_rkMicStream.active){
      _rkMicStream = await navigator.mediaDevices.getUserMedia({audio:true});
    }
    _rkMicChunks = [];
    const mimeType = (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) ? 'audio/webm;codecs=opus' : 'audio/webm';
    _rkMicRecorder = new MediaRecorder(_rkMicStream, {mimeType});
    _rkMicRecorder.ondataavailable = e => { if(e.data && e.data.size > 0) _rkMicChunks.push(e.data); };
    _rkMicRecorder.start();
  } finally {
    _rkMicBusy = false;
  }
}
function rkMicStopAndTranscribe(){
  return new Promise(resolve => {
    if(!rkMicIsRecording()){ resolve(''); return; }
    const mimeType = _rkMicRecorder.mimeType || 'audio/webm';
    _rkMicRecorder.onstop = async () => {
      // OJO: el stream NO se detiene acá a propósito — se reutiliza para la próxima grabación
      // dentro de la misma visita a Survival Kit. Se libera en rkMicRelease().
      const blob = new Blob(_rkMicChunks, {type:mimeType});
      _rkMicChunks = [];
      if(blob.size < 500){ resolve(''); return; }
      try{
        const b64 = await new Promise((res, rej) => {
          const reader = new FileReader();
          reader.onloadend = () => res(String(reader.result).split(',')[1]);
          reader.onerror = rej;
          reader.readAsDataURL(blob);
        });
        const r = await fetch('/api/transcribe', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({audio:b64, mimeType})
        });
        const data = await r.json();
        resolve((data.text || '').trim());
      }catch(e){
        rkDebugLog('transcripción falló — ' + e);
        resolve('');
      }
    };
    try{ _rkMicRecorder.stop(); }catch(e){ resolve(''); }
  });
}
// Cancela una grabación en curso (botón 🔄) SIN soltar el hardware — se puede volver a grabar
// de inmediato. Para soltar el micrófono del todo, ver rkMicRelease().
function rkMicReset(){
  if(_rkMicRecorder && _rkMicRecorder.state === 'recording'){
    _rkMicRecorder.onstop = null;
    try{ _rkMicRecorder.stop(); }catch(e){}
  }
  _rkMicChunks = [];
  _rkMicRecorder = null;
  return true;
}
// Libera el micrófono del todo (detiene el stream real) — se llama al salir de Survival Kit
// (rkBackToMap), no después de cada grabación individual.
function rkMicRelease(){
  rkMicReset();
  if(_rkMicStream){ _rkMicStream.getTracks().forEach(t => t.stop()); _rkMicStream = null; }
}

// ── TTS voz Oliver — mismo patrón que ttsSpeak() de index.html (línea ~1524), mismo endpoint
// POST /api/tts, con el mismo fallback a speechSynthesis si la llamada falla.
// Reforzado el 9 de agosto — Angel notó que sonaba más americano (tipo Boston) que británico.
// El preset de voz ('echo') no controla el acento en sí — la única palanca real es este texto
// de "instructions", así que se hace explícito y repetido (no alcanza con decirlo una vez).
const RK_OLIVER_TTS_INSTRUCTIONS = 'Speak with a natural British English accent (like a friendly London teenager) — this is essential: NOT American, avoid any American vowel sounds, rhotic R\'s, or American intonation patterns. Upbeat and playful but relaxed and easygoing, never rushed, around 16-18 years old, like a fun older brother. Clear pronunciation for a young English learner, natural conversational pace.';
// Narrador neutro y voces de diálogo para Stop, Look & Listen (18 agosto) — deliberadamente
// NO son Oliver (regla "Oliver = Survival Kit" sigue firme). Mismo endpoint /api/tts, solo con
// voz/instrucciones distintas — ver rkTtsSpeakVoice() más abajo.
const RK_NARRATOR_TTS_INSTRUCTIONS = 'Speak with a clear, neutral British English accent. Warm and engaging storytelling voice, like a documentary narrator — NOT a specific character, NOT American. Measured pace, clear pronunciation for a young English learner.';
const RK_SLL_VOICE_A = {voice:'echo', instructions:'Speak with a British English accent, adult voice, friendly and clear, natural conversational pace, NOT American.'};
const RK_SLL_VOICE_B = {voice:'nova', instructions:'Speak with a British English accent, a different adult voice from the other speaker, friendly and clear, natural conversational pace, NOT American.'};
let _rkTtsAudio = null;
// Núcleo genérico con voz/instrucciones parametrizables — refactor del 18 de agosto (antes
// rkTtsSpeak() tenía la voz de Oliver fija adentro). Devuelve una Promise que se resuelve
// cuando el audio termina, para poder encadenar líneas de un diálogo en secuencia sin que se
// atropellen (await rkTtsSpeakVoice(...) por cada línea).
async function rkTtsSpeakVoice(text, voice, instructions){
  if(_rkTtsAudio){ try{ _rkTtsAudio.pause(); }catch(e){} _rkTtsAudio = null; }
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  if(!text || !text.trim()) return;
  try{
    const r = await fetch('/api/tts', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, instructions, voice})
    });
    if(!r.ok) throw new Error('tts http ' + r.status);
    const data = await r.json();
    if(!data.audio) throw new Error('no audio');
    const audio = new Audio(`data:${data.mimeType || 'audio/mpeg'};base64,${data.audio}`);
    _rkTtsAudio = audio;
    await new Promise((resolve) => {
      audio.onended = () => { if(_rkTtsAudio === audio) _rkTtsAudio = null; resolve(); };
      audio.play().catch(() => resolve());
    });
  }catch(e){
    await new Promise((resolve) => {
      try{
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-GB'; u.rate = 0.9;
        u.onend = () => resolve();
        window.speechSynthesis.speak(u);
      }catch(e2){ rkDebugLog('TTS falló y el fallback nativo también — ' + e2); resolve(); }
    });
  }
}
// Oliver (Survival Kit) — mismo patrón que ttsSpeak() de index.html (línea ~1524), mismo
// endpoint POST /api/tts, con el mismo fallback a speechSynthesis si la llamada falla.
// Reforzado el 9 de agosto — Angel notó que sonaba más americano (tipo Boston) que británico.
// El preset de voz ('echo') no controla el acento en sí — la única palanca real es este texto
// de "instructions", así que se hace explícito y repetido (no alcanza con decirlo una vez).
// 'fable' en vez del 'echo' por defecto — experimento (9 agosto, 2do intento): las
// "instructions" ya piden explícitamente acento británico y no americano, y aun así Angel lo
// siguió escuchando americano. El preset de voz SÍ influye en qué tan bien seguir la
// instrucción de acento (no es solo un timbre) — 'fable' es el candidato más prometedor para
// esto en el catálogo de OpenAI.
async function rkTtsSpeak(text){
  return rkTtsSpeakVoice(text, 'fable', RK_OLIVER_TTS_INSTRUCTIONS);
}
// Corta cualquier audio de Oliver/narrador que siga sonando al salir de la estación —
// hallazgo de QA (19 agosto): "← Map" es un botón global, siempre visible dentro de una
// estación (línea ~332), así que se puede tocar a mitad de un audio de Survival Kit o de
// Stop, Look & Listen. Antes solo rkTtsSpeakVoice() paraba el audio anterior, y solo al
// arrancar uno nuevo — si el usuario simplemente se iba, el audio seguía sonando de fondo
// sobre el mapa. Mismo criterio que rkMicRelease() en rkBackToMap().
function rkStopAllTts(){
  if(_rkTtsAudio){ try{ _rkTtsAudio.pause(); }catch(e){} _rkTtsAudio = null; }
  if(window.speechSynthesis) window.speechSynthesis.cancel();
}

// ── Chat/IA — mismo patrón que callClaude() de index.html (línea ~1160), mismo endpoint
// POST /api/chat y mismo modelo, sin tocar el server.
const RK_MODEL = 'claude-haiku-4-5-20251001';
async function rkCallClaude(prompt, maxTokens = 500){
  const res = await fetch('/api/chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({model:RK_MODEL, max_tokens:maxTokens, messages:[{role:'user', content:prompt}]})
  });
  if(!res.ok) throw new Error('API error ' + res.status);
  const data = await res.json();
  return data.content[0].text;
}

function rkEscapeHtml(text){
  const d = document.createElement('div');
  d.textContent = text == null ? '' : String(text);
  return d.innerHTML;
}

// ══ Construye los hotspots clickeables sobre el mapa ══
function rkRenderHotspots(){
  const wrap = document.getElementById('rk-hotspots');
  wrap.innerHTML = RK_STATIONS.map(st => `
    <button class="rk-hotspot" title="${st.name}" aria-label="${st.name}"
      style="left:${st.left}%;top:${st.top}%;width:${st.w}%;height:${st.h}%"
      onclick="rkEnterStation('${st.id}')"></button>
  `).join('');
}
