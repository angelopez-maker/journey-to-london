    {id:"sll_sports_skateboarding",cat:"sports",level:"easy",options:["Skateboarding","Roller skating","Snowboarding"],answer:0,fragment:"In this fast-paced sport, athletes ride on a wooden deck with four small wheels. They perform spins, flips, and high jumps on ramps and rails, trying to get the best score from the judges in a concrete park.",hook:"The sport made its very first appearance at the Summer Olympic Games in Tokyo in 2021."},
    {id:"sll_sports_wembleystadium",cat:"sports",level:"medium",options:["Wembley Stadium","Old Trafford","Stamford Bridge"],answer:0,fragment:"This massive arena in London is the traditional home of English football. It features a giant steel arch over the roof that can be seen from across the city, holding ninety thousand cheering fans during a major cup final.",hook:"The stadium contains two thousand, six hundred and eighteen toilets, more than any other sports venue in the world."},
    {id:"sll_sports_badminton",cat:"sports",level:"hard",options:["Badminton","Squash","Table tennis"],answer:0,fragment:"In this fast indoor racket sport, players do not hit a bouncy rubber ball. Instead, they use lightweight rackets to hit a special cone-shaped object made of feathers across a high net.",hook:"The sport takes its English name from a large country estate in Gloucestershire where it was historically played by the Duke of Beaufort."},
  ]},
  {id:"stories", icon:"📚", label:"Stories & Worlds", q:"Which story or character is this about?", items:[
    {id:"sll_books_alicesadventures", fragment:"A curious girl follows a white rabbit down a hole and falls into a strange world full of a grinning cat, a hatter having a never-ending tea party, and a queen who loves to shout \"Off with their heads!\"", options:["Alice's Adventures in Wonderland", "Peter Pan", "The Chronicles of Narnia"], answer:0},
    {id:"sll_books_charliechocolatefactory", fragment:"A poor boy finds a golden ticket hidden inside a sweet wrapper, winning him a tour of the strangest and most magical sweet-making place in the world, run by a mysterious and eccentric owner.", options:["Charlie and the Chocolate Factory", "Matilda", "James and the Giant Peach"], answer:0},
    {id:"sll_books_peterpan", fragment:"A boy who never wants to grow up flies out of his bedroom window and leads three children to a magical island full of pirates, mermaids, and a ticking crocodile.", options:["Peter Pan", "Alice in Wonderland", "The Wind in the Willows"], answer:0},
    {id:"sll_books_winniepooh", fragment:"A gentle, honey-loving bear lives in a forest with his animal friends, including an anxious piglet, a bouncy tiger, and a gloomy donkey. He often gets stuck when he eats too much honey.", options:["Winnie-the-Pooh", "Paddington", "The BFG"], answer:0},
    {id:"sll_characters_sherlockholmes", fragment:"This fictional detective lives on Baker Street in London, is famous for his deerstalker hat and pipe, and solves impossible mysteries using logic and careful observation. His loyal friend is a doctor.", options:["Sherlock Holmes", "James Bond", "Peter Pan"], answer:0},
    {id:"sll_quotes_hamletbyshakespeare", fragment:"In a famous play, a prince stands alone on stage and asks the audience: \"To be, or not to be, that is the question.\"", options:["Hamlet", "Romeo and Juliet", "Macbeth"], answer:0},
    {id:"sll_stories_dragonball", cat:"stories", cefr:"B1", level:'medium', fragment:"In a famous Japanese animated series, a Saiyan warrior named Goku trains in martial arts and defends Earth. Characters gather seven magical glowing spheres that summon a giant wish-granting serpent when brought together.", options:["Dragon Ball", "Naruto", "One Piece"], answer:0, hook:"Creator Akira Toriyama originally based the main character and story on the classic sixteenth-century Chinese novel Journey to the West.", q:"Which animated series is this about?"},
    {id:"sll_stories_matilda", cat:"stories", cefr:"A1", level:'easy', fragment:"This story by Roald Dahl is about a smart young girl. She loves reading books. She uses magic powers with her mind to trick her scary headmistress, Miss Trunchbull.", options:["Matilda", "Coraline", "James and the Giant Peach"], answer:0, hook:"The West End stage musical adaptation won seven Olivier Awards in 2012, setting a record at the time.", q:"Which story is this about?"},
    // Misión 13 (Respuesta RN - Mision 13 - SLL - oleada 1.txt)
    {id:"sll_stories_spiderman",cat:"stories",level:"medium",options:["Spider-Man","Batman","Iron Man"],answer:0,fragment:"This famous New York superhero swings between skyscrapers using webs. Behind the mask is a teenage student called Peter Parker, who lives in Queens.",hook:"Unlike earlier teenage heroes, he was not a sidekick to an adult hero."},
    {id:"sll_stories_lordoftherings",cat:"stories",level:"medium",options:["The Lord of the Rings","The Chronicles of Narnia","Harry Potter"],answer:0,fragment:"In this famous fantasy story, a small hero with big hairy feet must make a long and dangerous journey to destroy an evil treasure. The British author invented complete languages for the elves before he even wrote the story.",hook:"For economic reasons, the story was originally published in three separate volumes over the course of a year."},
    // Misión 13 (Respuesta RN - Mision 13 - SLL - oleada 2.txt)
    {id:"sll_stories_chroniclesofnarnia",cat:"stories",level:"medium",options:["The Chronicles of Narnia","A Series of Unfortunate Events","The Golden Compass"],answer:0,fragment:"Four siblings are sent to live in a large countryside house to escape a war. While exploring, the youngest girl hides inside a piece of wooden furniture and discovers a snowy, magical forest ruled by a wicked witch.",hook:"Its author, C. S. Lewis, taught at both Oxford and Cambridge universities."},
    {id:"sll_stories_dracula",cat:"stories",level:"hard",options:["Dracula","Frankenstein","Dr. Jekyll and Mr. Hyde"],answer:0,fragment:"A young English lawyer travels to a dark castle in Transylvania to help a mysterious nobleman buy a house in London. He soon discovers his host only comes out at night and sleeps in a wooden box.",hook:"The author never actually visited Eastern Europe, but instead researched the geography and traditions by reading books at a library."},
    // Misión 13 (Respuesta RN - Mision 13 - SLL - oleada 3.txt)
    {id:"sll_stories_hobbit",cat:"stories",level:"hard",options:["The Hobbit","The Golden Compass","The Sword in the Stone"],answer:0,fragment:"This fantasy novel follows a quiet, short hero who enjoys staying in his comfortable hole in the ground. He is pushed into a wild adventure by a tall wizard and thirteen dwarves who want to recover treasure from a dragon.",hook:"The author first wrote the opening line of the book on a blank piece of paper while he was marking his students' exams."},
    {id:"sll_stories_pinocchio",cat:"stories",level:"easy",options:["Pinocchio","The Little Prince","Rumpelstiltskin"],answer:0,fragment:"This classic European fairy tale features a magical wooden puppet who desperately wants to become a real human boy. His biggest problem is that his nose grows much longer every time he tells a lie.",hook:"In the original story, the famous puppet was carved from a mysterious block of talking pinewood."},
  ]},
  {id:"people", icon:"👤", label:"People & Characters", q:"Who is this describing?", items:[
    {id:"sll_characters_isaacnewton", fragment:"This English scientist described the force of gravity after supposedly watching an apple fall from a tree. He is buried in Westminster Abbey, and a unit of force is named after him.", options:["Isaac Newton", "Charles Darwin", "Alexander Fleming"], answer:0},
    {id:"sll_characters_queenelizabethii", fragment:"This woman became Queen of the United Kingdom in 1952 and reigned for over 70 years, longer than any other British monarch. She was famous for her love of corgi dogs.", options:["Queen Elizabeth II", "Queen Victoria", "Queen Anne"], answer:0},
    {id:"sll_characters_williamshakespeare", fragment:"This playwright, born in the town of Stratford-upon-Avon, wrote plays like Romeo and Juliet and A Midsummer Night's Dream, and is often considered the greatest writer in the English language.", options:["William Shakespeare", "Charles Dickens", "J.R.R. Tolkien"], answer:0},
    {id:"sll_quotes_winstonchurchill", fragment:"During the Second World War, a British Prime Minister gave a famous speech that included the line: \"We shall fight on the beaches, we shall fight on the landing grounds...\"", options:["Winston Churchill", "King George VI", "Margaret Thatcher"], answer:0},
    {id:"sll_quotes_admiralnelsonbattle", fragment:"Before a famous naval battle in 1805, a British admiral sent a signal to his fleet that read: \"England expects that every man will do his duty.\"", options:["Admiral Nelson", "Admiral Drake", "Winston Churchill"], answer:0},
    {id:"sll_people_adalovelace", cat:"people", cefr:"A1", level:'easy', fragment:"This clever woman lived in London long ago. She worked with Charles Babbage on an early counting machine. She wrote instructions for it and became the first computer programmer.", options:["Ada Lovelace", "Marie Curie", "Rosalind Franklin"], answer:0, hook:"Every October, an international celebration called Ada Lovelace Day honours the achievements of women in science and technology.", q:"Which historical figure is this about?"},
    {id:"sll_people_charlesdarwin", cat:"people", cefr:"B1+", level:'hard', fragment:"Sailing aboard HMS Beagle on a five-year global voyage, this English naturalist studied unique finches and giant tortoises in the Galapagos Islands. His observations led him to publish the theory of evolution by natural selection.", options:["Charles Darwin", "Gregor Mendel", "Alexander von Humboldt"], answer:0, hook:"His portrait appeared on the official British ten-pound banknote for nearly eighteen years until 2018.", q:"Which historical figure is this about?"},
    {id:"sll_people_lionelmessi", cat:"people", cefr:"B1+", level:'hard', fragment:"Hailing from Rosario, Argentina, this legendary football forward won eight Ballon d'Or awards and captained his national team when they won the World Cup in Qatar.", options:["Lionel Messi", "Cristiano Ronaldo", "Neymar"], answer:0, hook:"When he was thirteen, Barcelona promised him his first contract by writing it on a paper napkin, which later sold at auction for almost one million dollars.", q:"Which sports star is this about?"},
    // Misión 13 (Respuesta RN - Mision 13 - SLL - oleada 1.txt)
    {id:"sll_people_mrbeast",cat:"people",level:"hard",options:["MrBeast","PewDiePie","Markiplier"],answer:0,fragment:"This American creator is famous for massive YouTube challenges and giving away huge amounts of money. In one of his earliest viral videos, he simply sat in a chair and counted to 100,000.",hook:"It took him exactly forty hours to count to 100,000, and some parts had to be sped up to keep the video under YouTube's upload limit."},
    // 17 oct (Angel): Florence Pugh. Datos: Wikipedia (Oxford, Manilva, Amy March, Yelena) y SlashFilm (el cameo de 2026).
    {id:"sll_people_florencepugh",cat:"people",level:"medium",options:["Florence Pugh","Emma Watson","Millie Bobby Brown"],answer:0,fragment:"This English actress was born in Oxford and lived in Spain when she was a little girl. She played Amy in Little Women, and in Marvel films she plays Yelena, the little sister of Black Widow.",hook:"In 2026, she made a surprise appearance as Yelena in Spider-Man: Brand New Day.",q:"Which actress is this about?"},
    {id:"sll_people_rowanatkinson",cat:"people",level:"medium",options:["Rowan Atkinson","Daniel Radcliffe","Hugh Grant"],answer:0,fragment:"This British actor is famous worldwide for playing a clumsy man in a brown suit who rarely speaks. Before he became a comedy star, he actually earned a master's degree in electrical engineering.",hook:"The creators considered several other vegetable names for the famous character, including Mr. Cauliflower."},
    // Misión 13 (Respuesta RN - Mision 13 - SLL - oleada 2.txt)
    {id:"sll_people_alberteinstein",cat:"people",level:"medium",options:["Albert Einstein","Thomas Edison","Nikola Tesla"],answer:0,fragment:"This famous theoretical physicist is known around the world for his wild white hair. He developed the theory of relativity, which completely changed how humans understand space, time, and gravity in the universe.",hook:"He was offered the position of President of Israel in 1952, but he politely declined, stating that he lacked the natural ability to deal with human beings."},
    {id:"sll_people_kingcharlesiii",cat:"people",level:"easy",options:["King Charles III","Prince William","King George VI"],answer:0,fragment:"This British monarch had to wait longer than anyone else in history to take the throne. He loves gardening and the environment, and his official coronation took place at Westminster Abbey in front of the world.",hook:"He became the first British royal heir in history to earn a university degree when he graduated from Cambridge."},
    // Misión 13 (Respuesta RN - Mision 13 - SLL - oleada 3.txt)
    {id:"sll_people_tomholland",cat:"people",level:"medium",options:["Tom Holland","Robert Pattinson","Daniel Radcliffe"],answer:0,fragment:"This young British actor trained heavily in gymnastics and dance, which allowed him to do his own flips on set. He became world-famous for playing a teenage superhero from New York who swings between tall buildings using special webs.",hook:"He found out he had won his most famous acting role by reading an announcement on Instagram."},
    {id:"sll_people_florencenightingale",cat:"people",level:"medium",options:["Florence Nightingale","Mary Seacole","Edith Cavell"],answer:0,fragment:"This famously dedicated British nurse changed how hospitals operate forever. She travelled far to care for wounded soldiers during a terrible war, earning a lasting nickname because she always carried a light at night.",hook:"She kept a pet owl named Athena that she rescued in Athens and often carried around in her pocket."},
  ]},
  {id:"games", icon:"🎮", label:"Games & Gaming", q:"Which game or character is this about?", items:[
    {id:"sll_games_clashroyale", cat:"games", cefr:"A1", level:'easy', fragment:"In this mobile game you drop your troops into an arena to destroy the enemy king. You have exactly three minutes to win the battle using drops of pink elixir.", options:["Clash Royale", "Brawl Stars", "Minecraft"], answer:0, hook:"In 2017, this mobile game actually won a British Academy Games Award for being the best esports game of the year."},
    {id:"sll_games_legogames", cat:"games", cefr:"A2", level:'easy', fragment:"A British video game studio makes these famous adventures where the whole world is built of plastic bricks. If your character loses all their health they do not die, they simply break into tiny pieces.", options:["Lego games", "Roblox", "Minecraft"], answer:0, hook:"The very first of these games started as an adventure about Lego knights, but it was turned into Lego Star Wars before it ever came out."},
    {id:"sll_games_minecraft", cat:"games", cefr:"A1", level:'easy', fragment:"In this survival game, players build with blocks and explore huge open worlds. At night, green creatures sneak up silently and explode near player houses.", options:["Minecraft", "Roblox", "Terraria"], answer:0, hook:"The scary high-pitched screech made by the Nether Ghast was created by recording the sound of the composer's sleeping cat when it was woken up.", q:"Which game is this about?"},
    {id:"sll_games_supermario", cat:"games", cefr:"A1", level:'easy', fragment:"In a classic platform adventure, a famous plumber wearing a red cap runs through the Mushroom Kingdom. He eats a special mushroom to grow bigger and rescues a princess from a giant turtle.", options:["Super Mario", "Sonic the Hedgehog", "Crash Bandicoot"], answer:0, hook:"Voice actor Charles Martinet set a Guinness World Record for performing the voice of Mario in over one hundred video games.", q:"Which game series is this about?"},
    {id:"sll_games_fortnite", cat:"games", cefr:"A2", level:'easy', fragment:"In a popular battle royale game, one hundred players leap from a flying bus onto an island. To survive against opponents, players collect materials like wood and stone to build walls and ramps during fights.", options:["Fortnite", "Apex Legends", "PUBG"], answer:0, hook:"In February 2019, electronic DJ Marshmello held a live virtual concert inside Fortnite that was watched by over ten million players at the same time.", q:"Which game is this about?"},
    {id:"sll_games_grandtheftauto", cat:"games", cefr:"B1", level:'medium', fragment:"The cities in this huge action series look like famous American places, such as Los Angeles and Miami. But the studio that leads the series is actually based in Edinburgh, in Scotland.", options:["Grand Theft Auto", "Cyberpunk 2077", "Saints Row"], answer:0, hook:"Grand Theft Auto V earned one billion dollars in just three days, faster than any film, book or game before it.", q:"Which video game series is this about?"},
    {id:"sll_games_pokemon", cat:"games", cefr:"B1", level:'medium', fragment:"In this creature-collecting adventure, players explore wild routes to discover mysterious monsters. When battling in the wild, trainers throw a small red and white ball to capture them and add them to their team.", options:["Pokémon", "Digimon", "Yu-Gi-Oh!"], answer:0, hook:"Japanese actress Ikue Otani has been the voice of Pikachu since 1997, and her voice is kept in every language, even in the English version.", q:"Which game series is this about?"},
    {id:"sll_games_fallguys", cat:"games", cefr:"B1+", level:'hard', fragment:"In a colourful multiplayer game created in London, sixty bean-shaped characters scramble through chaotic obstacle courses. Contestants must grab ledges, dodge giant swinging hammers, and avoid falling into pink slime to win a crown.", options:["Fall Guys", "Stumble Guys", "Gang Beasts"], answer:0, hook:"The game creators took inspiration for their bouncy obstacle courses from classic physical game shows like Takeshi's Castle and Wipeout.", q:"Which game is this about?"},
    // Misión 13 (Respuesta RN - Mision 13 - SLL - oleada 1.txt)
    {id:"sll_games_roblox",cat:"games",level:"easy",options:["Roblox","Terraria","Among Us"],answer:0,fragment:"This huge gaming platform has millions of different 3D worlds built entirely by its own players. When the creators first tested it back in 2004, they actually called it DynaBlocks.",hook:"As of August 2020, over half of all children under age sixteen in the United States played this game."},
    {id:"sll_games_pacman",cat:"games",level:"medium",options:["Pac-Man","Space Invaders","Donkey Kong"],answer:0,fragment:"In this classic arcade hit, a yellow character runs around a maze eating dots and dodging ghosts. The creator said the idea for its shape came from a pizza with one slice missing.",hook:"The highest possible score you can get in the original arcade game is 3,333,360 points, which requires a perfect run."},
    {id:"sll_games_sonicthehedgehog",cat:"games",level:"easy",options:["Sonic the Hedgehog","Crash Bandicoot","Spyro the Dragon"],answer:0,fragment:"This famous video game hero is known for running at incredible speeds. The creators originally designed him in a blue colour so he would match the logo of the company that made him.",hook:"His early codename was Mr. Hedgehog."},
    // Misión 13 (Respuesta RN - Mision 13 - SLL - oleada 2.txt)
    {id:"sll_games_amongus",cat:"games",level:"easy",options:["Among Us","Brawl Stars","Rocket League"],answer:0,fragment:"You are on a spaceship trying to complete your daily tasks. But watch out, because one member of the crew is secretly working against everyone. You must call a meeting to vote the imposter out.",hook:"Among Us was originally created by a tiny team of just three people, and it took two full years after its release to become a global hit."},
    {id:"sll_games_tombraider",cat:"games",level:"medium",options:["Tomb Raider","Uncharted","Horizon Zero Dawn"],answer:0,fragment:"This action-adventure game stars an athletic British archaeologist who travels the world exploring ancient ruins. She carries twin pistols and solves complex puzzles while constantly avoiding dangerous traps.",hook:"The main character was originally meant to be a South American adventurer named Laura Cruz, before the developers changed her to a British aristocrat."},
    {id:"sll_games_legendofzelda",cat:"games",level:"easy",options:["The Legend of Zelda","Final Fantasy","God of War"],answer:0,fragment:"In this famous video game series, you play as a brave hero who wears a green tunic and carries a sword. He explores a vast fantasy kingdom to rescue a princess from a powerful evil king.",hook:"The creator of the series got the idea from his own childhood memories of exploring the hills, caves, and forests near his home."},
    // Misión 13 (Respuesta RN - Mision 13 - SLL - oleada 3.txt)
    {id:"sll_games_rocketleague",cat:"games",level:"easy",options:["Rocket League","Gran Turismo","Trackmania"],answer:0,fragment:"In this fast-paced video game, you do not play football with human players. Instead, you drive super-fast cars with boosters inside a giant cage, jumping and boosting to hit a massive ball into the opposing team's net.",hook:"The developers later added a winter mode that replaces the giant football with a heavy ice hockey puck."},
    {id:"sll_games_seaofthieves",cat:"games",level:"medium",options:["Sea of Thieves","Skull and Bones","Monkey Island"],answer:0,fragment:"In this multiplayer adventure made by a British studio, you team up to sail a pirate ship across a vast ocean. You must read treasure maps, fight skeleton crews, and patch holes in your ship during storms.",hook:"The game features a special campaign where players can interact with characters and locations from the Disney film series Pirates of the Caribbean."},
    {id:"sll_games_tetris",cat:"games",level:"medium",options:["Tetris","Puyo Puyo","Bejeweled"],answer:0,fragment:"In this classic video puzzle game, colourful blocks made of four squares slowly fall from the top of the screen. You must rotate them to create solid horizontal lines that instantly disappear.",hook:"The game was created by a software engineer working at the Soviet Academy of Sciences in Moscow."},
  ]},
  {id:"music", icon:"🎵", label:"Music", q:"Who or what is this about?", items:[
    {id:"sll_music_moonwalk", cat:"music", cefr:"B1", level:'medium', fragment:"A famous pop singer performed this dance move on television in the nineteen eighties. It creates an optical illusion where it looks like the person is walking forwards but they are actually gliding smoothly backwards across the floor.", options:["The Moonwalk", "The Robot", "The Worm"], answer:0, hook:"Michael Jackson did not invent this move: he learned it from young dancers, including dancers from the American TV show Soul Train."},
    {id:"sll_music_abbeyroad", cat:"music", cefr:"A2", level:'easy', fragment:"There is a street crossing in London that became famous because four musicians walked across it for their album cover. Today people constantly stop the traffic to take the exact same photograph.", options:["Abbey Road", "Penny Lane", "Carnaby Street"], answer:0, hook:"The band hired a policeman to stop the traffic so the photographer could stand on a small ladder in the middle of the street."},
    {id:"sll_music_gorillaz", cat:"music", cefr:"A1", level:'easy', fragment:"This famous band comes from London. The four members are drawn cartoon characters, not real people. They play cool pop music on big screens.", options:["Gorillaz", "Daft Punk", "Kraftwerk"], answer:0, hook:"Gorillaz earned a spot in Guinness World Records as the most successful virtual band in music history.", q:"Which musical group is this about?"},
    {id:"sll_music_glastonburyfestival", cat:"music", cefr:"A1", level:'easy', fragment:"This big summer event happens on a farm in England. Thousands of fans camp in green fields. Famous music stars sing on a massive Pyramid Stage.", options:["Glastonbury Festival", "Coachella", "Tomorrowland"], answer:0, hook:"A ticket for the very first festival, in 1970, cost one pound, and it came with free milk from the farmer's cows.", q:"Which music festival is this about?"},
    {id:"sll_music_bagpipes", cat:"music", cefr:"B1", level:'medium', fragment:"To play this traditional wind instrument, the musician blows air into a leather pouch held under one arm. Squeezing the pouch pushes air through several wooden tubes, creating a continuous loud humming sound.", options:["Bagpipes", "Accordion", "Flute"], answer:0, hook:"For more than 180 years, British kings and queens have had their own official piper, whose job is to play under the royal window every morning.", q:"Which musical instrument is this about?"},
    {id:"sll_music_breakdance", cat:"music", cefr:"B1", level:'medium', fragment:"Originating in street culture, this energetic dance style combines fast footwork, acrobatic spins on the back or head, and sudden freeze poses. Dancers take turns in a central circle while a DJ plays heavy funk beats.", options:["Breakdance", "Tap dance", "Salsa"], answer:0, hook:"Under its official name, breaking, this dance made its Olympic debut at the Paris 2024 Games, where Japanese dancer B-Girl Ami won the first women's gold medal.", q:"Which dance style is this about?"},
    {id:"sll_music_coldheart", cat:"music", cefr:"B1", level:'medium', fragment:"In this global dance hit, a legendary seventies British pop singer joined forces with a modern female pop star. Their track blended four classic vintage tunes into one fresh electronic disco track that topped charts worldwide.", options:["Cold Heart", "Levitating", "Your Song"], answer:0, hook:"With this song, Elton John became the first artist to have a UK Top 10 single in six different decades.", q:"Which song is this about?"},
    {id:"sll_music_happy", cat:"music", cefr:"B1+", level:'hard', fragment:"Written for an animated comedy film featuring small yellow minions, this upbeat soul track features handclaps and cheerful lyrics. The twenty-four-hour music video showed ordinary people dancing joyfully down city streets.", options:["Happy", "Roar", "Shake It Off"], answer:0, hook:"The song was nominated for an Oscar, but it lost to Let It Go from Frozen.", q:"Which song is this about?"},
    // Misión 13 (Respuesta RN - Mision 13 - SLL - oleada 1.txt)
    {id:"sll_music_wewillrockyouwearethecha_key",cat:"music",level:"easy",options:["A legal battle","A family argument","A fight with another band"],answer:0,key:"song:we_will_rock_you_we_are_the_champions",fragment:"These famous Queen tracks from 1977 were written to be sung by football fans. In the year they were recorded, the band was fighting something big. What kind of disagreement left Queen almost broke?"},
    {id:"sll_music_mrbluesky_key",cat:"music",level:"easy",options:["A Swiss chalet","A London hotel","A beach house"],answer:0,key:"song:mr_blue_sky",fragment:"This cheerful 1977 song by Electric Light Orchestra is a celebration of a sunny morning after weeks of rain. Where did Jeff Lynne lock himself away to write it?"},
    {id:"sll_music_dualipa",cat:"music",level:"hard",options:["Dua Lipa","Billie Eilish","Ariana Grande"],answer:0,fragment:"This British-Albanian pop star became famous all over the world with hits like 'Levitating'. Her first name means 'love' in the Albanian language.",hook:"She left her family in Kosovo at the age of fifteen and moved back to London by herself to try and start her music career."},
    {id:"sll_music_youllneverwalkalone_key",cat:"music",level:"easy",options:["A storm","A flood","A blizzard"],answer:0,key:"song:you_ll_never_walk_alone",fragment:"This famous anthem from 1963 was originally written for a Broadway musical. The song offers comfort during hard times in life. What kind of weather is used to describe those hard times?"},
    {id:"sll_music_coldplay",cat:"music",level:"medium",options:["Coldplay","Arctic Monkeys","Radiohead"],answer:0,fragment:"This British rock band is known for playing massive stadium concerts with glowing wristbands. The group originally met as students at a university in London in 1996.",hook:"Before choosing their famous name, the band members originally called themselves Pectoralz."},
    {id:"sll_music_adele",cat:"music",level:"hard",options:["Adele","Taylor Swift","Florence Welch"],answer:0,fragment:"This British singer is famous for powerful emotional ballads about heartbreak. She names her studio albums after the age she was when she wrote the music, starting with her debut album called 19.",hook:"She won an Academy Award for Best Original Song after writing the theme for a James Bond film."},
    // Misión 13 (Respuesta RN - Mision 13 - SLL - oleada 2.txt)
    {id:"sll_music_queen",cat:"music",level:"hard",options:["Queen","The Rolling Stones","The Who"],answer:0,fragment:"This famous British rock band played a historic twenty-minute set at the Live Aid concert. Their charismatic singer led the massive stadium crowd in a vocal warm-up, performing their biggest anthems without any backing dancers.",hook:"The band's famous crest logo was designed by their lead singer, who had earned a college degree in art and graphic design before becoming a rock star."},
    {id:"sll_music_wannabebyspicegirls_key",cat:"music",level:"easy",options:["Accept her friends","Buy her flowers","Learn to dance"],answer:0,key:"song:wannabe",fragment:"The Spice Girls released the pop song \"Wannabe\" in 1996. It became a huge global hit because of its catchy chorus and strong 'Girl Power' message. According to the song, what must you do if you want to date one of them?"},
    {id:"sll_music_eltonjohn",cat:"music",level:"medium",options:["Elton John","Freddie Mercury","Paul McCartney"],answer:0,fragment:"This British musician is famous for his colourful suits and large, unusual glasses. He performed a special tribute song playing a grand piano at the funeral of Diana, Princess of Wales.",hook:"He started playing the piano as a young boy, amazing his family by figuring out how to play famous waltzes just by listening to them."},
    {id:"sll_music_davidbowie",cat:"music",level:"hard",options:["David Bowie","Mick Jagger","Rod Stewart"],answer:0,fragment:"This English rock star constantly changed his musical style and fashion. For a while, he performed as an alien rock star from Mars with bright red hair, wearing dramatic makeup and shiny space suits.",hook:"His real name was David Jones. He changed it so people would not confuse him with Davy Jones of the Monkees."},

// SURVIVAL KIT — primera estación con mecánica real (8-9 de agosto)
// Única de las 8 con Speaking. v1 acordada con Angel: 4-5 escenarios reales de
// supervivencia en Londres, sin evaluar pronunciación (igual criterio que
// Show & Tell oral) — el feedback de Oliver se enfoca en vocabulario/gramática/
// si el mensaje se entendería, nunca en cómo sonó, porque un transcript de
// Whisper no lleva esa información (mismo argumento que evaluatePETSpeaking()
// en index.html, línea ~7407).
//
// Rediseño del 9 de agosto — feedback real de Angel/Fer probando en Railway:
// 1) La frase objetivo estaba visible en pantalla, así que grabar era solo
//    LEER la respuesta, no producirla — se sacó de la vista por completo (ya
//    no existe ningún lugar donde se muestre o se escuche literal antes de
//    intentarlo; si el intento queda muy lejos, Oliver la modela recién en el
//    feedback, como ya decía el prompt).
// 2) Todo era texto — Oliver nunca hablaba (ni el contexto de la misión ni el
//    feedback), lo que hacía que la "estación de Speaking" se sintiera como
//    Q&A Trivia (que sí es 100% texto). Ahora Oliver habla ambos momentos con
//    rkTtsSpeak(), con un botón ▶ de respaldo por si el autoplay no corre.
// 3) Las 5 misiones eran un menú de tarjetas sueltas y terminar una te dejaba
//    sin nada más que hacer. Ahora es una cadena: orden barajado (Fisher-
//    Yates, Principio 9 — nunca confiar en random ingenuo) al entrar, avance
//    automático con "Continue →" tras el feedback, y al completar las 5 se
//    ofrece repetir con un ciclo nuevo (orden re-barajado) o volver al mapa.
//    "← Map" (arriba) sigue disponible en cualquier momento para salir antes.
// 4) (9 agosto, ronda 3) Angel notó riesgo de "estación abandonada" — con una
//    sola versión fija por misión, un segundo/tercer ciclo muestra EXACTAMENTE
//    lo mismo. Se agregaron variantes de contexto/frase por misión; cuál se
//    usa se sortea una vez por ciclo (rkSkStartCycle) y queda fija durante ese
//    ciclo (para que "🔄 Try again" no cambie el escenario a mitad de intento)
//    — un ciclo nuevo (repetir) vuelve a sortear. Sigue siendo contenido 100%
//    escrito a mano (nada generado por IA en este paso) — mismo perfil de
//    riesgo bajo del Principio 13, solo más contenido base.
// 5) (9 agosto, ronda 3, v2) Angel + Claude Chat afinaron la idea: 5 situaciones
//    base se mantienen (son el "mapa" del módulo — hello/time/directions/food/
//    airport), pero cada una pasa de 2 a 5 variantes escritas a mano, con la
//    MISMA situación pero distinta intención conversacional dentro de ella
//    (p.ej. en el café: pedir comida, pedir postre, cambiar el plato, pedir
//    para dos, pedir la cuenta). Esto conecta directo con el Principio 14:
//    Oliver ya reacciona a la intención comunicativa, no a una frase fija, así
//    que ampliar el pool de variantes no lo vuelve "generador caótico" — sigue
//    siendo un pool cerrado, escrito por nosotros, elegido por el sistema.

// Fisher-Yates real (Principio 9) — un random ingenuo sobre una lista de 5 se siente "rachado"
// (misma misión dos veces seguidas, por ejemplo); esto sí garantiza una mezcla pareja.
// ── Lo no visto primero (17 de octubre) ───────────────────────────────────────────────
// El servidor guarda qué vio cada estación (`seen`, el mismo registro del medio pago). Antes las
// estaciones sorteaban al azar y repetían aunque quedara contenido nuevo; ahora el juego lee esa
// lista al cargar y la completa a medida que se juega. Sin lista (otro tema, sin red), todo es
// "no visto" y queda el sorteo de siempre.
let _rkSeen = {};
function rkSeenSet(station){ return new Set(_rkSeen[station] || []); }
function rkMarkSeen(station, ids){
  const lista = _rkSeen[station] = _rkSeen[station] || [];
  [].concat(ids).forEach(id => { if(id && !lista.includes(id)) lista.push(id); });
}
// Baraja y deja primero lo no visto; lo visto queda al final, también barajado.
// Con k (rondas de varias piezas: Match Day 7, SLL 4), las primeras k salen mezcladas por nivel
// (easy | medium | hard), en proporción a lo que queda sin ver de cada uno. Así cada ronda trae una
// mezcla y la proporción se mantiene pareja todo el verano: no se gastan las fáciles al principio.
// Las piezas sin nivel cuentan como un grupo más. Solo con el tema que lleva puntaje (full).
function rkPreferUnseen(station, items, idOf, k){
  const vistos = rkSeenSet(station), mezcla = rkShuffle(items);
  const nuevas = mezcla.filter(x => !vistos.has(idOf(x))), viejas = mezcla.filter(x => vistos.has(idOf(x)));
  if(k > 1 && RK_THEMES_CON_PUNTAJE.includes(RK_ACTIVE_THEME) && nuevas.length > k){
    const primeras = rkMixByLevel(nuevas, k);
    return primeras.concat(nuevas.filter(x => !primeras.includes(x)), viejas);
  }
  return nuevas.concat(viejas);
}
// Elige k piezas de pool (ya barajado) con cuotas por nivel proporcionales a lo que hay de cada uno.
// Los decimales se reparten al azar, con probabilidad según su tamaño (redondeo estocástico).
function rkMixByLevel(pool, k){
  const grupos = {};
  pool.forEach(x => (grupos[x.level || '-'] = grupos[x.level || '-'] || []).push(x));
  const niveles = Object.keys(grupos);
  const cuota = {}; let falta = k;
  niveles.forEach(l => { cuota[l] = Math.floor(k * grupos[l].length / pool.length); falta -= cuota[l]; });
  while(falta > 0){
    const resto = niveles.map(l => Math.max(0, k * grupos[l].length / pool.length - cuota[l]) + 1e-9)
      .map((r, i) => grupos[niveles[i]].length > cuota[niveles[i]] ? r : 0);
    let t = Math.random() * resto.reduce((a, b) => a + b, 0), i = 0;
    while(i < resto.length - 1 && (t -= resto[i]) > 0) i++;
    cuota[niveles[i]]++; falta--;
  }
  return rkShuffle(niveles.flatMap(l => grupos[l].slice(0, cuota[l])));
}
async function rkSeenLoad(){
  // Ojo: corre al cargar, antes de que exista _RK_PASSPORT_PREVIEW; por eso lee la URL acá.
  const preview = new URLSearchParams(location.search).get('passport') === 'preview';
  if(preview || !RK_THEMES_CON_PUNTAJE.includes(RK_ACTIVE_THEME)) return;
  try {
    const r = await fetch('/api/passport?full=1');
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    Object.entries(d.seen || {}).forEach(([st, ids]) => rkMarkSeen(st, ids));
  } catch(e){ console.warn('[passport] no se pudo leer lo ya visto:', e.message); }
}

function rkShuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 17 de septiembre: mismo bug que ya se había visto en JTL (index.html, shuffleMCOptions) —
// Angel y los niños lo encontraron jugando Match Day en vivo: el contenido generado tiende a
// poner la respuesta correcta casi siempre en options[0] (102 de 103 preguntas del archivo
// tenían answer:0). Se baraja acá, después de cargar las preguntas, para que la posición de la
// respuesta correcta sea 1/n real en cada partida — no se toca el dato original, solo la copia
// que se juega. Usado por Match Day y Stop, Look & Listen (mismo formato options[]+answer:número).
function rkShuffleMCOptions(item){
  if(!Array.isArray(item.options) || item.options.length < 2 || typeof item.answer !== 'number') return item;
  const pairs = item.options.map((text, i) => ({text, correct: i === item.answer}));
  for(let i = pairs.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
  }
  return {...item, options: pairs.map(p => p.text), answer: pairs.findIndex(p => p.correct)};
}

function rkSkStartCycle(){
  const scenarios = rkCurrentSkScenarios();
  // 16 oct: con 10 escenarios, un ciclo completo sería el doble de largo y pagaría el doble. Se
  // sortean RK_SK_CYCLE_LENGTH, así el ciclo queda en 5 misiones y 15 shillings como máximo.
  // 17 oct: primero los escenarios que todavía tienen variantes sin jugar, y en cada uno una
  // variante sin jugar. Con todo visto, vuelve al sorteo de siempre.
  const vistos = rkSeenSet('survival_kit');
  const libres = s => s.variants.map((v, i) => i).filter(i => !vistos.has(s.variants[i].id));
  _rkSkOrder = rkShuffle(scenarios).sort((a, b) => (libres(b).length > 0) - (libres(a).length > 0))
    .slice(0, RK_SK_CYCLE_LENGTH).map(s => s.id);
  // Un variant por misión, sorteado una vez por ciclo (no en cada render) — así "Try again"
  // dentro del mismo intento no cambia el escenario a mitad de camino (ver nota arriba, punto 4).
  _rkSkVariant = {};
  scenarios.forEach(s => {
    const opciones = libres(s).length ? libres(s) : s.variants.map((v, i) => i);
    _rkSkVariant[s.id] = opciones[Math.floor(Math.random() * opciones.length)];
  });
  // 17 oct (Misión 13): mezcla de dificultad. Se arman cuotas por nivel con las variantes libres de
  // los escenarios del ciclo, y cada escenario toma una variante libre del nivel que falta.
  if(RK_THEMES_CON_PUNTAJE.includes(RK_ACTIVE_THEME)){
    const enCiclo = scenarios.filter(s => _rkSkOrder.includes(s.id));
    const pool = rkShuffle(enCiclo.flatMap(s => libres(s).map(i => ({ s, i, level: s.variants[i].level }))));
    if(pool.length > _rkSkOrder.length){
      const cuota = {};
      rkMixByLevel(pool, _rkSkOrder.length).forEach(x => cuota[x.level || '-'] = (cuota[x.level || '-'] || 0) + 1);
      rkShuffle(enCiclo).forEach(s => {
        const mias = libres(s);
        const i = mias.find(i => cuota[s.variants[i].level || '-'] > 0);
        if(i != null){ _rkSkVariant[s.id] = i; cuota[s.variants[i].level || '-']--; }
      });
    }
  }
  _rkSkIndex = 0;
  _rkSkScore = 0;
  rkSkRenderMission();
}

function rkSkRenderMission(){
  if(rkMicIsRecording()) rkMicReset();
  const _scenario = rkCurrentSkScenarios().find(s => s.id === _rkSkOrder[_rkSkIndex]);
  const _variant = _scenario.variants[_rkSkVariant[_scenario.id] || 0];
  _rkSkCurrent = {..._scenario, ..._variant};
  _rkSkTranscript = '';

  wrap.innerHTML = `

// Botón grabar → "🎙️ Get ready..." ~900ms → "🔴 Recording". La grabación REAL arranca apenas se
// aprieta (rkMicStart ya casi no tiene delay gracias al precalentado — ver rkMicPrewarm), así que
// nada de lo que digan durante el "Get ready" se pierde; el cue es solo para que alcancen a
// prepararse antes de hablar (pedido de Angel — "como en la radio").
async function rkSkMicToggle(){
  const btn = document.getElementById('rk-sk-mic-btn');
  const resetBtn = document.getElementById('rk-sk-reset-btn');
  const tx = document.getElementById('rk-sk-transcript');
  if(!rkMicIsRecording()){
    document.getElementById('rk-sk-oliver-area').innerHTML = '';
    btn.disabled = true;
    btn.style.background = 'rgba(245,158,11,.15)'; btn.style.borderColor = 'rgba(245,158,11,.4)'; btn.textContent = '🎙️ Get ready...';
    resetBtn.style.display = 'block';
    tx.textContent = '';
    try{
      await rkMicStart();
    }catch(e){
      tx.textContent = 'Mic not available — check permissions.';
      btn.disabled = false; btn.style.background = 'rgba(16,185,129,.1)'; btn.style.borderColor = 'rgba(16,185,129,.3)'; btn.textContent = '🎤 Record your try';
      resetBtn.style.display = 'none';
      return;
    }
    btn.disabled = false;
    setTimeout(() => {
      if(rkMicIsRecording()){ btn.style.background = 'rgba(239,68,68,.2)'; btn.style.borderColor = '#ef4444'; btn.textContent = '🔴 Recording — speak now!'; }
    }, 900);
  } else {
    btn.style.background = 'rgba(16,185,129,.1)'; btn.style.borderColor = 'rgba(16,185,129,.3)';
    btn.textContent = '🎤 Record your try'; btn.disabled = true;
    resetBtn.style.display = 'none';
    tx.textContent = 'Transcribing...';
    const text = await rkMicStopAndTranscribe();
    _rkSkTranscript = text || '';
    btn.disabled = false;
    if(text){ tx.textContent = `"${text}"`; rkSkGetFeedback(); }
    else{ tx.textContent = '(no speech detected — try again)'; }
  }
}

function rkSkGetFeedback(){
  if(!_rkSkCurrent) return;
  const area = document.getElementById('rk-sk-oliver-area');
  const oliverHtml = (inner, replay) => `<div class="rk-sk-oliver">
      <img src="Avatar/oliver-blackwood.png" alt="Oliver Blackwood">
      <div><div class="rk-sk-oliver-name">Oliver Blackwood</div><div class="rk-sk-oliver-text">${inner}</div></div>
      ${replay ? `<button class="rk-sk-hear-btn" onclick="rkSkReplay()" title="Hear it">▶</button>` : ''}
    </div>`;
  area.innerHTML = oliverHtml('Reading what you said...', false);
  const prompt = `You are Oliver Blackwood, a friendly Ravenclaw student from Hogwarts, giving quick spoken-English feedback to a Chilean kid (somewhere between 9 and 12 years old) practicing survival English phrases for a trip to London. You're relaxed and easygoing about it — this is meant to feel like a fun chat, never like a test.

SETTING (stay strictly inside this): present-day London, England. If money/currency comes up for any reason, it is always pounds sterling (£), never dollars.

Scenario: ${_rkSkCurrent.context}
One EXAMPLE of a natural way to respond (this is just ONE possible answer, NOT the only correct one — it's here only so you know roughly what kind of response fits the situation): "${_rkSkCurrent.target}"
What they actually said (transcribed with Whisper from their spoken audio): "${_rkSkTranscript}"

GRADING PHILOSOPHY — read this carefully, it matters: you must distinguish between COMMUNICATION SUCCESS and LANGUAGE PERFECTION. Your job is to judge the former, never the latter. This is an open-ended real-life situation, not a fill-in-the-blank quiz. Many different responses are equally correct — ordering a different food or drink than the example, giving a different (but real and coherent) reason for visiting London, asking a question with different wording. Judge ONLY whether what they said is clear, grammatically reasonable, and makes sense as a response to the scenario above — NEVER mark something as wrong or "not quite it" just because it differs from the example phrase's specific content. Do not steer them toward the example's exact words or details (the exact food, the exact reason, the exact wording) — any sensible content is a correct answer. If what they said is already clear, grammatical, and appropriate, just celebrate it — do not suggest a "simpler" or "more natural" alternative purely because it's shorter or closer to the example; that's discouraging for something that was already right, and it's the single biggest thing to avoid.

You must NEVER:
- Invent places, facts, or trivia beyond this specific scenario — you are reacting to their attempt, not teaching new facts.
- Introduce any currency other than pounds sterling (£).
- Treat the example phrase as "the correct answer" — it's one option among many, see grading philosophy above.
- Repeat, quote, or otherwise engage with content that is off-topic, nonsensical, or inappropriate — if the transcript is any of those, just give a light, friendly nudge back to the task (e.g. "Let's give it another try, what would you say if...").
- Scold, lecture, moralize, or explain why something was wrong to say.
- Use bad language yourself, no matter what the transcript contains.
- Break character as Oliver Blackwood, or mention that you are an AI.

Give warm, encouraging feedback in 2-3 short sentences, in simple English. Do NOT comment on pronunciation or accent — you only have a text transcript, not audio, so that information doesn't exist. Only offer a corrected version if there's a genuine grammar or clarity problem with what THEY said (correcting their own idea, never swapping it for the example's content) — and even then, keep it light and quick, not a lecture. Keep it casual and relaxed, like a friendly older kid, never like a teacher grading an exam. Reply with plain text only, no JSON, no markdown.

Then, on a NEW LAST LINE, write nothing but a score for what they said, in exactly this format:
SCORE: 3
Use 3 if they communicated clearly and the English was reasonable (small slips are fine — remember, communication over perfection). Use 1 if they got the idea across but there was a real grammar or clarity problem. Use 0 ONLY if the transcript is off-topic, nonsense, or they did not attempt the task at all. This line is for the game, not for them — never mention it, never explain it, and never put anything else on that line.`;
  rkCallClaude(prompt, 300)
    .then(text => {
      const { clean, score } = rkSkReadScore(text);
      _rkSkScore += score;
      _rkSkLastSpoken = clean;
      area.innerHTML = oliverHtml(rkEscapeHtml(clean), true) + rkSkActionsHtml();
      rkTtsSpeak(clean);
    })
    .catch(() => {
      // El niño habló y el fallo fue nuestro: se le paga 1, igual que el fallback del SCORE.
      _rkSkScore += 1;
      console.warn('[survival kit] no se pudo evaluar la misión, se asume 1');
      const msg = "Oops — I couldn't reach the library right now. Try again in a moment!";
      area.innerHTML = oliverHtml(msg, false) + rkSkActionsHtml();
    });
}

// Separa el veredicto del juego del texto que ve y escucha el niño. Dos cosas importantes:
// la línea SCORE se borra SIEMPRE, incluso cuando no se pudo leer (si el modelo la escribió
// raro, que se pierda el puntaje, pero que nunca se la lea Oliver en voz alta); y cuando no
// hay puntaje el fallback es 1, nunca 0 — si el niño habló y el fallo fue nuestro, se
// comunicó. El 0 solo lo pone el modelo a propósito.
function rkSkReadScore(text){
  const raw = String(text || '');
  const m = raw.match(/SCORE\s*[:=]?\s*(\d)/i);
  let score = 1;
  if(m){
    score = Math.max(0, Math.min(3, parseInt(m[1], 10)));
  } else {
    console.warn('[survival kit] Oliver no devolvió SCORE legible, se asume 1');
  }
  const clean = raw.replace(/^[^\S\r\n]*SCORE\b.*$/gim, '').replace(/\n{3,}/g, '\n\n').trim();
  return { clean, score };
}

// ── Mic/Whisper — mismo patrón que micStart()/micStopAndTranscribe()/micReset() de index.html
// (línea ~932), re-implementado acá porque este archivo no comparte script con index.html.
// Mismo endpoint POST /api/transcribe, sin tocarlo.
//
// Precalentado (9 de agosto — feedback real de Fer/Angel: "hablo y no se empieza a grabar").
// Causa real: getUserMedia() es async, así que entre apretar el botón y que el micrófono
// realmente empiece a capturar pasa una fracción de segundo — si el niño habla apenas ve el
// botón rojo, esas primeras palabras se pierden. Solución: pedir el permiso y abrir el stream
// UNA VEZ al entrar a Survival Kit (rkMicPrewarm, llamado desde rkRenderStation), y reutilizar
// ese mismo stream en cada grabación de la sesión — así rkMicStart() ya no espera a
// getUserMedia y el MediaRecorder arranca prácticamente al instante. Se libera recién al salir
// de la estación (rkMicRelease, desde rkBackToMap), no después de cada grabación individual.
let _rkMicRecorder = null, _rkMicChunks = [], _rkMicStream = null, _rkMicBusy = false;
function rkMicIsRecording(){ return !!(_rkMicRecorder && _rkMicRecorder.state === 'recording'); }
async function rkMicPrewarm(){
  if(_rkMicStream || _rkMicBusy) return;
  try{ _rkMicStream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ /* silencioso — si el permiso se deniega acá, rkMicStart() lo vuelve a pedir al grabar */ }
}
async function rkMicStart(){
  if(_rkMicBusy || rkMicIsRecording()) return;
  _rkMicBusy = true;
  try{
    if(!_rkMicStream || !_rkMicStream.active){
      _rkMicStream = await navigator.mediaDevices.getUserMedia({audio:true});
    }
    _rkMicChunks = [];
    const mimeType = (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) ? 'audio/webm;codecs=opus' : 'audio/webm';
    _rkMicRecorder = new MediaRecorder(_rkMicStream, {mimeType});
    _rkMicRecorder.ondataavailable = e => { if(e.data && e.data.size > 0) _rkMicChunks.push(e.data); };
    _rkMicRecorder.start();
  } finally {
    _rkMicBusy = false;
  }
}
function rkMicStopAndTranscribe(){
  return new Promise(resolve => {
    if(!rkMicIsRecording()){ resolve(''); return; }
    const mimeType = _rkMicRecorder.mimeType || 'audio/webm';
    _rkMicRecorder.onstop = async () => {
      // OJO: el stream NO se detiene acá a propósito — se reutiliza para la próxima grabación
      // dentro de la misma visita a Survival Kit. Se libera en rkMicRelease().
      const blob = new Blob(_rkMicChunks, {type:mimeType});
      _rkMicChunks = [];
      if(blob.size < 500){ resolve(''); return; }
      try{
        const b64 = await new Promise((res, rej) => {
          const reader = new FileReader();
          reader.onloadend = () => res(String(reader.result).split(',')[1]);
          reader.onerror = rej;
          reader.readAsDataURL(blob);
        });
        const r = await fetch('/api/transcribe', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({audio:b64, mimeType})
        });
        const data = await r.json();
        resolve((data.text || '').trim());
      }catch(e){
        rkDebugLog('transcripción falló — ' + e);
        resolve('');
      }
    };
    try{ _rkMicRecorder.stop(); }catch(e){ resolve(''); }
  });
}
// Cancela una grabación en curso (botón 🔄) SIN soltar el hardware — se puede volver a grabar
// de inmediato. Para soltar el micrófono del todo, ver rkMicRelease().
function rkMicReset(){
  if(_rkMicRecorder && _rkMicRecorder.state === 'recording'){
    _rkMicRecorder.onstop = null;
    try{ _rkMicRecorder.stop(); }catch(e){}
  }
  _rkMicChunks = [];
  _rkMicRecorder = null;
  return true;
}
// Libera el micrófono del todo (detiene el stream real) — se llama al salir de Survival Kit
// (rkBackToMap), no después de cada grabación individual.
function rkMicRelease(){
  rkMicReset();
  if(_rkMicStream){ _rkMicStream.getTracks().forEach(t => t.stop()); _rkMicStream = null; }
}

// ── TTS voz Oliver — mismo patrón que ttsSpeak() de index.html (línea ~1524), mismo endpoint
// POST /api/tts, con el mismo fallback a speechSynthesis si la llamada falla.
// Reforzado el 9 de agosto — Angel notó que sonaba más americano (tipo Boston) que británico.
// El preset de voz ('echo') no controla el acento en sí — la única palanca real es este texto
// de "instructions", así que se hace explícito y repetido (no alcanza con decirlo una vez).
const RK_OLIVER_TTS_INSTRUCTIONS = 'Speak with a natural British English accent (like a friendly London teenager) — this is essential: NOT American, avoid any American vowel sounds, rhotic R\'s, or American intonation patterns. Upbeat and playful but relaxed and easygoing, never rushed, around 16-18 years old, like a fun older brother. Clear pronunciation for a young English learner, natural conversational pace.';
// Narrador neutro y voces de diálogo para Stop, Look & Listen (18 agosto) — deliberadamente
// NO son Oliver (regla "Oliver = Survival Kit" sigue firme). Mismo endpoint /api/tts, solo con
// voz/instrucciones distintas — ver rkTtsSpeakVoice() más abajo.
const RK_NARRATOR_TTS_INSTRUCTIONS = 'Speak with a clear, neutral British English accent. Warm and engaging storytelling voice, like a documentary narrator — NOT a specific character, NOT American. Measured pace, clear pronunciation for a young English learner.';
const RK_SLL_VOICE_A = {voice:'echo', instructions:'Speak with a British English accent, adult voice, friendly and clear, natural conversational pace, NOT American.'};
const RK_SLL_VOICE_B = {voice:'nova', instructions:'Speak with a British English accent, a different adult voice from the other speaker, friendly and clear, natural conversational pace, NOT American.'};
let _rkTtsAudio = null;
// Núcleo genérico con voz/instrucciones parametrizables — refactor del 18 de agosto (antes
// rkTtsSpeak() tenía la voz de Oliver fija adentro). Devuelve una Promise que se resuelve
// cuando el audio termina, para poder encadenar líneas de un diálogo en secuencia sin que se
// atropellen (await rkTtsSpeakVoice(...) por cada línea).
async function rkTtsSpeakVoice(text, voice, instructions){
  if(_rkTtsAudio){ try{ _rkTtsAudio.pause(); }catch(e){} _rkTtsAudio = null; }
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  if(!text || !text.trim()) return;
  try{
    const r = await fetch('/api/tts', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, instructions, voice})
    });
    if(!r.ok) throw new Error('tts http ' + r.status);
    const data = await r.json();
    if(!data.audio) throw new Error('no audio');
    const audio = new Audio(`data:${data.mimeType || 'audio/mpeg'};base64,${data.audio}`);
    _rkTtsAudio = audio;
    await new Promise((resolve) => {
      audio.onended = () => { if(_rkTtsAudio === audio) _rkTtsAudio = null; resolve(); };
      audio.play().catch(() => resolve());
    });
  }catch(e){
    await new Promise((resolve) => {
      try{
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-GB'; u.rate = 0.9;
        u.onend = () => resolve();
        window.speechSynthesis.speak(u);
      }catch(e2){ rkDebugLog('TTS falló y el fallback nativo también — ' + e2); resolve(); }
    });
  }
}
// Oliver (Survival Kit) — mismo patrón que ttsSpeak() de index.html (línea ~1524), mismo
// endpoint POST /api/tts, con el mismo fallback a speechSynthesis si la llamada falla.
// Reforzado el 9 de agosto — Angel notó que sonaba más americano (tipo Boston) que británico.
// El preset de voz ('echo') no controla el acento en sí — la única palanca real es este texto
// de "instructions", así que se hace explícito y repetido (no alcanza con decirlo una vez).
// 'fable' en vez del 'echo' por defecto — experimento (9 agosto, 2do intento): las
// "instructions" ya piden explícitamente acento británico y no americano, y aun así Angel lo
// siguió escuchando americano. El preset de voz SÍ influye en qué tan bien seguir la
// instrucción de acento (no es solo un timbre) — 'fable' es el candidato más prometedor para
// esto en el catálogo de OpenAI.
async function rkTtsSpeak(text){
  return rkTtsSpeakVoice(text, 'fable', RK_OLIVER_TTS_INSTRUCTIONS);
}
// Corta cualquier audio de Oliver/narrador que siga sonando al salir de la estación —
// hallazgo de QA (19 agosto): "← Map" es un botón global, siempre visible dentro de una
// estación (línea ~332), así que se puede tocar a mitad de un audio de Survival Kit o de
// Stop, Look & Listen. Antes solo rkTtsSpeakVoice() paraba el audio anterior, y solo al
// arrancar uno nuevo — si el usuario simplemente se iba, el audio seguía sonando de fondo
// sobre el mapa. Mismo criterio que rkMicRelease() en rkBackToMap().
function rkStopAllTts(){
  if(_rkTtsAudio){ try{ _rkTtsAudio.pause(); }catch(e){} _rkTtsAudio = null; }
  if(window.speechSynthesis) window.speechSynthesis.cancel();
}

// ── Chat/IA — mismo patrón que callClaude() de index.html (línea ~1160), mismo endpoint
// POST /api/chat y mismo modelo, sin tocar el server.
const RK_MODEL = 'claude-haiku-4-5-20251001';
async function rkCallClaude(prompt, maxTokens = 500){
  const res = await fetch('/api/chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({model:RK_MODEL, max_tokens:maxTokens, messages:[{role:'user', content:prompt}]})
  });
  if(!res.ok) throw new Error('API error ' + res.status);
  const data = await res.json();
  return data.content[0].text;
}

function rkEscapeHtml(text){
  const d = document.createElement('div');
  d.textContent = text == null ? '' : String(text);
  return d.innerHTML;
}

// ══ Construye los hotspots clickeables sobre el mapa ══

}

<script>
// ══════════════════════════════════════════════════════════════════════════
// PASAPORTE — capa de estado (Shillings + Passport Stamps)
// Diseño completo en deploy/"Rubberneckin' - Shillings y Passport Stamps (mecanica).md".
//
// Esta es la PRIMERA persistencia real del módulo: hasta ahora Rubberneckin' solo
// usaba sessionStorage para dos flags de intro, que se pierden al cerrar la pestaña.
//
// Es deliberadamente delgada. Toda la lógica vive en el servidor:
//   · cuánto se paga de verdad (regla de repetición con tope)
//   · si corresponde un sello y qué destino toca
// El cliente informa lo que pasó y pinta lo que le devuelven. No decide nada, así que
// tampoco puede equivocarse ni inventar un sello.
//
// Va en su propio <script> a propósito: no comparte scope con el script grande, así
// que no puede romper nada de lo que ya funciona. Se comunica por funciones globales.
// ══════════════════════════════════════════════════════════════════════════

// Cache local de la última vista devuelta por el servidor. Solo para pintar.
// La fuente de verdad es passport.json, siempre.
let RK_PASSPORT = null;

// Precios por estación, de la tabla final (sección 9 del documento de mecánica).
// Están acá como referencia para quien enganche las estaciones (paso 3): el máximo
// que puede entregar cada ronda. Lo que se manda al servidor es lo obtenido de verdad.
const RK_PRICE_MAX = {
  survival_kit: 15,        // 5 misiones x 3 (perfecta) / 1 (se comunicó) / 0
  mystery_picture: 14,     // 16 - 2 x pistas usadas
  scavenger_hunt: 12,      // 3 (Rodrigo) + 3 (Fernando) + 6 (concepto), piso 1
  mind_the_gap: 9,         // 3 palabras x 3
  stop_look_and_listen: 8, // 4 conceptos x 2
  match_day: 7,            // 7 preguntas x 1
};

// Cómo se traduce una actividad a shillings, estación por estación. Todo junto y acá a
// propósito: son los números de Angel, y tienen que poder cambiarse en un solo lugar sin
// leer el resto del archivo. El principio que los ordena está cerrado desde el diseño:
// **se paga por completar, no por acertar** — el niño juega para practicar, no para rendir.
// Donde hay variación es por la ayuda que usó, no por el error.
const RK_PAY = {
  mystery_picture:      {base:16, porPista:2, minimo:2, conOliver:1},
  mind_the_gap:         {porHueco:3},
  stop_look_and_listen: {porItem:2},
  match_day:            {porPregunta:1},
  // Scavenger Hunt es la única que interpreté yo: la tabla dice 3+3+6 con piso 1 y "varianza,
  // no techo", y la única fuente de varianza es la ayuda. Si Angel lo quería de otra forma,
  // se cambia acá y en ningún otro lado.
  scavenger_hunt:       {palabra:3, palabraConMc:2, palabraConOliver:1, concepto:6, conceptoConOliver:1},
};

// Cuelga el pago real —el del servidor, no el que suponíamos— al final de un contenedor.
function rkShowPayout(elId, data, station){
  const el = document.getElementById(elId);
  if(!el || !data) return;
  const div = document.createElement('div');
  div.className = 'rk-info-blurb';
  div.style.fontWeight = '700';
  div.textContent = `💰 ${data.paid} shilling${data.paid === 1 ? '' : 's'} earned` +
                    (data.repeat ? ' (half pay — you have played this before)' : '') +
                    (typeof rkBarNote === 'function' ? rkBarNote(station, data) : '');
  el.appendChild(div);
}

async function rkPassportLoad(){
  try {
    const r = await fetch('/api/passport');
    if(!r.ok) throw new Error('HTTP ' + r.status);
    RK_PASSPORT = await r.json();
  } catch(e){
    console.warn('[passport] no se pudo cargar:', e.message);
    RK_PASSPORT = null;   // el juego sigue funcionando sin pasaporte
  }
  return RK_PASSPORT;
}

// Se llama al terminar una ronda. `earned` es lo que sacó en bruto según la tabla;
// `itemId` es el id estable de la actividad jugada (ver documento de plantillas) y es
// lo que permite al servidor aplicar el medio pago si ya la había jugado. En las rondas de
// varias piezas (Match Day, SLL, Survival Kit) es un array con los ids de lo que salió.
//
// Devuelve { paid, repeat, newStamps } o null si no se pudo guardar. Un fallo de red
// NUNCA interrumpe el juego: se pierden esos shillings y se vuelven a ganar jugando.
// Los sellos, que son lo único irrecuperable, no dependen de esta llamada — los otorga
// el servidor con el estado que ya tiene grabado.
// Los temas de admin abuse —Fiestas Patrias, Halloween— y el `neutral` de maqueta NO llevan
// puntaje: son demos de cómo va el producto, no el producto (decisión de Angel, confirmada el 2
// de octubre). Si pagaran, una tarde de Halloween dejaría shillings y hasta un sello ganados con
// contenido que no es el del verano.
//
// El filtro va acá, en el único cuello de botella por donde pasan las seis estaciones, y no en
// cada una: así una estación nueva no puede olvidarse de aplicarlo.
const RK_THEMES_CON_PUNTAJE = ['full'];
rkSeenLoad();   // lo no visto primero (17 oct)

async function rkEarnShillings(station, earned, itemId, opts){
  rkMarkSeen(station, itemId);
  // La vista previa del equipo (?demo=preview / ?sll=preview) es para mirar, no para jugar.
  const q = new URLSearchParams(location.search);
  if(q.get('demo') === 'preview' || q.get('sll') === 'preview'){
    console.log(`[passport] vista previa: no se registra (${station} ${earned})`);
    return null;
  }
  if(!RK_THEMES_CON_PUNTAJE.includes(RK_ACTIVE_THEME)){
    console.log(`[passport] tema "${RK_ACTIVE_THEME}": sin puntaje, no se registra (${station} ${earned})`);
    return null;   // null = el llamador no muestra línea de pago, y el juego sigue igual
  }
  // Red de seguridad: ninguna estación puede pagar más que su máximo teórico. Si un día una
  // postal trae cuatro huecos en vez de tres, el pago no se infla en silencio — se tapa acá y
  // el número raro queda a la vista en la consola.
  const tope = RK_PRICE_MAX[station];
  if(tope != null && earned > tope){
    console.warn(`[passport] ${station} intentó pagar ${earned}, tope ${tope}`);
    earned = tope;
  }
  try {
    const r = await fetch('/api/passport/earn', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(Object.assign(Array.isArray(itemId)
        ? { station, earned, itemIds: itemId }
        : { station, earned, itemId: itemId || null },
        opts && opts.unknown ? { unknown: true } : {}))
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    RK_PASSPORT = data.passport;
    if(data.newStamps && data.newStamps.length) rkOnStampsEarned(data.newStamps);
    return data;
  } catch(e){
    console.warn('[passport] no se pudo registrar la actividad:', e.message);
    return null;
  }
}

// Hook del momento del sello. El diseño pide que aparezca INMEDIATAMENTE, encima de la
// actividad que lo gatilló y no al volver al mapa — es el momento raro y memorable del
// sistema. La capa (animación + timbre) vive en el último <script>: rkStampMomentShow().
function rkOnStampsEarned(stamps){
  stamps.forEach(s => console.log(`[passport] PASSPORT STAMP EARNED — ${s.place}, ${s.nation}`));
  if(typeof rkStampMomentShow === 'function') rkStampMomentShow(stamps);
}

// ── Lecturas para la UI del Underground (paso 4) ───────────────────────────
function rkPassportShillings(){ return RK_PASSPORT ? RK_PASSPORT.shillings : 0; }
function rkPassportStamps(){    return RK_PASSPORT ? RK_PASSPORT.stamps : []; }
function rkPassportN(){         return RK_PASSPORT ? RK_PASSPORT.n : 15; }

// Progreso de la vuelta en curso, ya acotado por el servidor a [0, N].
// Devuelve { scavenger_hunt: 12, ... } o {} si el pasaporte no cargó.
function rkPassportBars(){ return RK_PASSPORT ? RK_PASSPORT.bars : {}; }

// Fracción 0..1 de una estación, para el anillo del mapa. Abbey Road y Electric
// Cinema devuelven null: no tienen casillero, y esa ausencia es intencional —
// comunica que son parte del viaje pero no del circuito, sin explicárselo a nadie.
function rkPassportProgress(stationId){
  const bars = rkPassportBars();
  if(!(stationId in bars)) return null;
  return bars[stationId] / rkPassportN();
}

document.addEventListener('DOMContentLoaded', rkPassportLoad);

<style id="rk-tube-vintage">
  /* ══ RN · Capa visual "Tube vintage" (Angel, 17 oct 2026) ══════════════════════════════════
     Solo la capa de las estaciones: textos, tarjetas y botones. No cambia fondos, imágenes ni
     mecánica. La paleta sale del mapa del menú, los sellos y el pasaporte: papel crema, azul
     marino de la barra del roundel y rojo roundel. Pensada para PC primero (los niños juegan
     ahí el 90% del tiempo); en tablet se reacomoda sin romperse.
     Nota: el primer <style> del archivo trae un comentario con "rk-asterisco-barra" que lo cierra antes de
     tiempo, así que su @import de fuentes y su :root nunca se aplicaron (desde agosto). Esta
     capa no revive ese tema oscuro: trae sus propias fuentes y sus propios colores (--tv-*). */
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap');

    --tv-line:rgba(29,42,98,.18);
    --tv-shadow:0 1px 0 rgba(29,42,98,.10), 0 10px 26px rgba(20,28,60,.12);
    --tv-head:'Barlow Condensed','Arial Narrow',sans-serif;
    --tv-body:'Barlow','Segoe UI',system-ui,sans-serif;

  /* El mapa de fondo queda igual, con un velo de papel encima para que no compita con el texto */

    url('rubberneckin-assets/covers/tube_bg.jpg') center/cover no-repeat;}

    align-items:center;justify-content:center;font-size:24px;background:var(--tv-card);

// "Giant's Causeway" -> giants-causeway, "Derry/Londonderry" -> derry-londonderry
function rkStampSlug(place){
  return String(place).toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

function rkStampFallback(place, nation){
  const ink = RK_NATION_INK[nation] || '#7a2a2a';
  const longest = t => Math.max(4, ...String(t).split(/[\s\/]+/).map(w => w.length));
  return `<div class="rk-stamp-text" style="--rk-ink:${ink};--rk-len:${longest(place)};--rk-nlen:${longest(nation)}">
    <i>${RK_NATION_MARK[nation] || '✦'}</i><b>${rkEscapeHtml(place).replace(/\//g, '/<wbr>')}</b><span>${rkEscapeHtml(nation)}</span></div>`;
}

// El sello: intenta la imagen; si no carga, la reemplaza por el sello de texto.
function rkStampHtml(stamp, rot){
  const fb = rkStampFallback(stamp.place, stamp.nation).replace(/"/g,'&quot;');
  const tip = [RK_STAMP_SHOWS[stamp.place] ? 'On the stamp: ' + RK_STAMP_SHOWS[stamp.place] : '',
               RK_STAMP_FACTS[stamp.place] || ''].filter(Boolean).join('\n');
  return `<div class="rk-stamp" style="--rk-rot:${rot == null ? -5 : rot}deg"${tip ? ` title="${rkEscapeHtml(tip).replace(/"/g,'&quot;')}"` : ''}>
    <img src="${RK_STAMP_DIR}${rkStampSlug(stamp.place)}.png" alt="${rkEscapeHtml(stamp.place)} stamp"
      onerror="this.parentNode.innerHTML=this.dataset.fb" data-fb="${fb}"></div>`;
}

function rkStampDate(iso){
  // "2026-12-14" -> "14 Dec 2026", sin zona horaria de por medio
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if(!m) return '';
  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1];
  return `${+m[3]} ${mon} ${m[1]}`;
}

function _rkTodayIso(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function rkUndergroundEnsureScreen(){
  if(document.getElementById('screen-underground')) return;
  const el = document.createElement('div');
  el.id = 'screen-underground';
  el.className = 'screen';
  el.innerHTML = `
    <div class="rk-station-header">
      <span class="rk-station-icon">🚇</span>

    <div class="rk-ug-body" id="rk-ug-body"></div>`;
